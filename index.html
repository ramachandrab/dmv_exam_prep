<script>
// ── QUESTION BANK ─────────────────────────────────────────────────────────────
var Q=[
  {t:"Speed Limits",q:"What is the speed limit in a school zone unless otherwise posted?",o:["15 mph","25 mph","35 mph","20 mph"],a:1,e:"25 mph near a school when children are present. Some communities are adopting 20 mph early; statewide 20 mph takes effect in 2031.",src:"Handbook S7"},
  {t:"Speed Limits",q:"What is the maximum speed on a two-lane undivided road outside a business or residential district if not posted?",o:["55 mph","65 mph","45 mph","50 mph"],a:0,e:"55 mph is the prima facie limit on two-lane undivided roads outside business or residential districts.",src:"CVC 22349b"},
  {t:"Speed Limits",q:"What is the Basic Speed Law?",o:["Always drive at the posted speed limit","Never drive faster than is safe for current conditions","Drive no faster than 65 mph on any road","Match the speed of surrounding traffic"],a:1,e:"CVC 22350: Never drive faster than is safe for current road conditions, regardless of the posted limit.",src:"CVC 22350"},
  {t:"Speed Limits",q:"What is the maximum speed limit on a freeway unless otherwise posted?",o:["55 mph","65 mph","70 mph","75 mph"],a:1,e:"65 mph on most California freeways unless a higher limit of 70 mph is posted.",src:"CVC 22349a"},
  {t:"Speed Limits",q:"What is the speed limit in an alley?",o:["10 mph","15 mph","20 mph","25 mph"],a:1,e:"15 mph is the prima facie speed limit in any alley in California.",src:"Handbook S7"},
  {t:"Speed Limits",q:"What is the speed limit within 100 feet of a railroad crossing where you cannot see 400 feet in both directions?",o:["10 mph","15 mph","25 mph","35 mph"],a:1,e:"15 mph within 100 feet of a railroad crossing with limited visibility. You may drive faster if the crossing is controlled by gates, a warning signal, or a flagman.",src:"CVC 22352"},
  {t:"Speed Limits",q:"What is the speed limit in a business or residential district if not posted?",o:["25 mph","35 mph","40 mph","55 mph"],a:0,e:"25 mph is the prima facie speed limit in any business or residential district unless a different limit is posted.",src:"CVC 22352"},
  {t:"Speed Limits",q:"You are driving in heavy rain and the posted limit is 65 mph. What should you do?",o:["Drive 65 mph - it is the legal limit","Slow down - the Basic Speed Law requires a safe speed for conditions","Drive exactly 55 mph","Use hazard lights and maintain speed"],a:1,e:"The Basic Speed Law always applies. Even at a 65 mph posted limit, you must slow to a speed safe for current weather.",src:"CVC 22350"},
  {t:"Speed Limits",q:"What is the speed limit at a blind intersection with no stop signs?",o:["10 mph","15 mph","25 mph","35 mph"],a:1,e:"A blind intersection with no stop signs at any corner where you cannot see cross traffic for 100 feet has a speed limit of 15 mph.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"What does a yellow traffic light mean?",o:["Speed up to make it through","Stop immediately","About to turn red - stop if you can do so safely","Yield to oncoming traffic"],a:2,e:"A yellow light warns the signal is about to turn red. Stop if you can do so safely before the intersection.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"A red arrow on a traffic signal means:",o:["Yield then proceed if clear","Stop - you may not turn in that direction","Slow down and proceed with caution","Stop then proceed when safe"],a:1,e:"A red arrow means STOP and do NOT turn in that direction, even after stopping.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"A flashing red traffic light means:",o:["Slow down and proceed","Treat like a stop sign - stop then go when safe","Yield to cross traffic","Proceed with caution"],a:1,e:"A flashing red must be treated as a stop sign: full stop, then proceed when safe.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"A flashing yellow light means:",o:["Stop before proceeding","Treat as a stop sign","Slow down and proceed with caution","Yield to all traffic"],a:2,e:"A flashing yellow means slow down and proceed with caution. You do not need to stop.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"A solid yellow center line on YOUR side of the road means:",o:["You may pass if safe","You may NOT pass","Passing allowed in daylight only","Slow down before passing"],a:1,e:"A solid yellow line on your side prohibits passing - do not cross it.",src:"Handbook S6"},
  {t:"Traffic Signals & Signs",q:"A solid white line on the right edge of the road means:",o:["You may cross it to pass","It marks the right edge - do not cross it","A bike lane you may enter anytime","A carpool lane boundary"],a:1,e:"A solid white line on the right edge marks the road boundary. Do not drive beyond it except to exit.",src:"Handbook S6"},
  {t:"Traffic Signals & Signs",q:"A broken yellow center line means:",o:["No passing at any time","Passing is allowed when safe","Two-way traffic only","Keep right at all times"],a:1,e:"A broken yellow center line means passing is allowed when it is safe to do so.",src:"Handbook S6"},
  {t:"Traffic Signals & Signs",q:"When a traffic light is not working at all, you should:",o:["Proceed at normal speed","Yield to the right only","Treat it as a 4-way stop - stop then proceed when safe","Flash headlights and proceed"],a:2,e:"When a traffic light is not working, treat the intersection as if it has STOP signs in all directions.",src:"Handbook S7"},
  {t:"Traffic Signals & Signs",q:"A solid yellow line is on your left and a broken yellow line is on your right. This means:",o:["Both directions may pass","Only you may pass - your side has a broken line","Only oncoming traffic may pass","Neither direction may pass"],a:1,e:"When a solid yellow line is paired with a broken yellow line, only the driver next to the broken line may pass.",src:"Handbook S6"},
  {t:"Road Signs",q:"What shape is a STOP sign?",o:["Circle","Triangle","Octagon","Diamond"],a:2,e:"Stop signs are always octagonal (8-sided) and red.",src:"Handbook S7"},
  {t:"Road Signs",q:"What does an orange diamond-shaped sign indicate?",o:["School zone","Railroad crossing","Construction or work zone","Pedestrian crossing"],a:2,e:"Orange diamond signs warn of construction or work zones. Fines are doubled in these areas.",src:"Handbook S7"},
  {t:"Road Signs",q:"What color are regulatory signs such as speed limit signs?",o:["Yellow","Orange","White with black text or red and white","Green"],a:2,e:"Regulatory signs are white with black text, or red and white such as STOP and YIELD signs.",src:"Handbook S7"},
  {t:"Road Signs",q:"A triangular red and white sign means:",o:["Stop","Slow down","Yield","No entry"],a:2,e:"An inverted triangle red and white sign is a YIELD sign.",src:"Handbook S7"},
  {t:"Road Signs",q:"What do blue highway signs indicate?",o:["Warnings and hazards","Regulatory rules","Services such as food, gas, and lodging","Distance and directions"],a:2,e:"Blue signs indicate motorist services: gas stations, food, lodging, hospitals, and rest areas.",src:"Handbook S7"},
  {t:"Road Signs",q:"Green highway signs are used for:",o:["Warning of hazards","Regulatory information","Guide and directional information such as exits and distances","Construction zones"],a:2,e:"Green signs provide guide information: highway exits, distances to cities, and directions.",src:"Handbook S7"},
  {t:"Road Signs",q:"A 5-sided pentagon-shaped sign means:",o:["Railroad crossing ahead","Yield ahead","You are near a school","Work zone ahead"],a:2,e:"A pentagon-shaped sign indicates you are near a school. Drive slowly and watch for children.",src:"Handbook S7"},
  {t:"Road Signs",q:"A yellow diamond sign with a picture of a deer means:",o:["Deer hunting area","Watch for animals crossing the road","No animals allowed","Wildlife preserve nearby"],a:1,e:"Diamond-shaped yellow signs are warning signs. A deer symbol warns drivers to watch for animals crossing the road ahead.",src:"Handbook S7"},
  {t:"Parking Rules",q:"It is illegal to park within how many feet of a fire hydrant?",o:["10 feet","15 feet","20 feet","25 feet"],a:1,e:"CVC 22514: No stopping, parking, or standing within 15 feet of a fire hydrant.",src:"CVC 22514"},
  {t:"Parking Rules",q:"When parallel parking, your wheels must be within how many inches of the curb?",o:["6 inches","12 inches","18 inches","24 inches"],a:2,e:"Your vehicle should be parallel and within 18 inches of the curb after parallel parking.",src:"Handbook S6"},
  {t:"Parking Rules",q:"When parking uphill WITH a curb, which direction should your front wheels face?",o:["Straight ahead","Toward the curb (right)","Away from the curb (left)","It does not matter"],a:2,e:"Uphill with a curb: turn wheels away from the curb (left). If the car rolls back it hits the curb and stops.",src:"Handbook S6"},
  {t:"Parking Rules",q:"When parking downhill WITH a curb, which direction should your front wheels face?",o:["Away from the curb (left)","Straight ahead","Toward the curb (right)","It does not matter"],a:2,e:"Downhill with a curb: turn front wheels toward the curb (right). If the car rolls forward the curb stops it.",src:"Handbook S6"},
  {t:"Parking Rules",q:"When parking on a hill with NO curb, which way do you turn your wheels?",o:["Left toward center of road","Straight ahead","Right toward the edge of the road","It does not matter"],a:2,e:"With no curb, always turn wheels to the right so the vehicle rolls away from the center of the road if the brakes fail.",src:"Handbook S6"},
  {t:"Parking Rules",q:"You may not park within how many feet of a crosswalk at an intersection?",o:["10 feet","15 feet","20 feet","25 feet"],a:2,e:"No parking within 20 feet of an unmarked or marked crosswalk at an intersection.",src:"Handbook S6"},
  {t:"Parking Rules",q:"You must not park within how many feet of a railroad crossing?",o:["50 feet","75 feet","100 feet","200 feet"],a:0,e:"Parking is prohibited within 50 feet of the nearest rail of a railroad crossing.",src:"Handbook S6"},
  {t:"Parking Rules",q:"Which of the following is always illegal when parking?",o:["Parking on a residential street overnight","Parking within 18 inches of the curb","Parking on a sidewalk or blocking a driveway","Parking facing traffic on a one-way street"],a:2,e:"Parking on a sidewalk or blocking a driveway is always illegal.",src:"Handbook S6"},
  {t:"Parking Rules",q:"You may park in a disabled parking space only if:",o:["You stop for just a moment","You have a valid DMV disabled person placard or special plate","The space has been vacant over 10 minutes","You are driving someone who has a disability"],a:1,e:"You must display a valid DMV-issued disabled person placard or disabled person license plate.",src:"CVC 22511.5"},
  {t:"Parking Rules",q:"How should you secure your vehicle when parking on a steep hill?",o:["Only if parking for more than 30 minutes","Only if the road is wet","Always set the parking brake and leave the vehicle in gear or Park","Only when facing downhill"],a:2,e:"Always set the parking brake and leave an automatic in Park (or manual in gear) when parking on any hill.",src:"Handbook S6"},
  {t:"Curb Colors",q:"What does a RED curb mean?",o:["No parking during business hours","No stopping standing or parking at any time","Loading zone for freight only","Emergency vehicles only"],a:1,e:"A red curb means no stopping, standing, or parking at any time for any vehicle.",src:"Handbook S6"},
  {t:"Curb Colors",q:"What does a YELLOW curb mean?",o:["No parking anytime","Parking for disabled only","Stop only long enough to load or unload - driver must stay with vehicle","Parking for 30 minutes maximum"],a:2,e:"A yellow curb: stop only long enough to load or unload. Non-commercial drivers must stay with the vehicle.",src:"Handbook S6"},
  {t:"Curb Colors",q:"What does a WHITE curb mean?",o:["No parking anytime","Stop only long enough to pick up or drop off passengers or mail","Parking for disabled persons only","Time-limited parking"],a:1,e:"A white curb: stop only long enough to pick up or drop off passengers or mail.",src:"Handbook S6"},
  {t:"Curb Colors",q:"What does a BLUE curb mean?",o:["No stopping anytime","Loading zone only","Parking for disabled persons with valid placard or plate only","Time-limited parking"],a:2,e:"A blue curb is reserved for disabled persons only. A valid DMV-issued placard or disabled person license plate is required.",src:"Handbook S6"},
  {t:"Curb Colors",q:"What does a GREEN curb mean?",o:["Parking is unlimited here","Parking allowed for a limited time - time is usually posted","Loading and unloading only","No parking anytime"],a:1,e:"A green curb allows parking for a limited time. The time is usually shown on a nearby sign or painted on the curb.",src:"Handbook S6"},
  {t:"Curb Colors",q:"You need to drop off a friend at a building entrance. Which curb color is most appropriate?",o:["Red","Blue","White","Green"],a:2,e:"A white curb is for briefly dropping off or picking up passengers.",src:"Handbook S6"},
  {t:"Curb Colors",q:"You want to pick up a freight package from a business. Which curb color allows this?",o:["White","Yellow","Blue","Green"],a:1,e:"A yellow curb allows loading and unloading of freight or passengers. Driver must remain with the vehicle.",src:"Handbook S6"},
  {t:"Curb Colors",q:"A friend asks you to park at a blue curb while they run an errand. You have no placard. You should:",o:["Park quickly - it will be a minute","Park and stay in the car","Refuse - parking at a blue curb without a valid placard is illegal","Park only if no disabled person is waiting"],a:2,e:"Parking at a blue curb without a valid disabled placard or plate is illegal regardless of how long you stay.",src:"CVC 22511.5"},
  {t:"Curb Colors",q:"You park at a yellow curb and walk into a store for 30 minutes. This is:",o:["Legal - yellow curbs allow 30 minutes","Legal - you can park as long as you want","Illegal - yellow curbs require the driver to remain with the vehicle","Legal only during business hours"],a:2,e:"A yellow curb is ONLY for loading and unloading. The driver must stay with the vehicle. Walking away is illegal.",src:"Handbook S6"},
  {t:"Curb Colors",q:"Which curb color indicates parking is completely forbidden at all times?",o:["Yellow","White","Green","Red"],a:3,e:"Red means absolutely no stopping, standing, or parking at any time for any vehicle.",src:"Handbook S6"},
  {t:"Curb Colors",q:"At a white curb, how long may you stop?",o:["Up to 30 minutes","Up to 15 minutes","Only long enough to pick up or drop off passengers or mail","As long as the driver stays in the vehicle"],a:2,e:"White curbs are for brief stops only - just long enough to pick up or drop off passengers or mail.",src:"Handbook S6"},
  {t:"Right-of-Way",q:"At an uncontrolled intersection two cars arrive at the same time. Who has the right of way?",o:["The driver going straight","The driver on the left","The driver on the right","The driver who arrived first"],a:2,e:"When two vehicles arrive simultaneously at an uncontrolled intersection, the vehicle on the right has the right of way.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"You are turning left at an intersection. When may you proceed?",o:["Whenever traffic looks light","Only when oncoming traffic and pedestrians have cleared","As soon as the light turns green","When a 3-second gap exists"],a:1,e:"When turning left, you must yield to all oncoming vehicles and pedestrians before proceeding.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"A pedestrian with a white cane or guide dog is at a crosswalk. You must:",o:["Slow down and proceed carefully","Stop and remain stopped until they have completely crossed","Honk to let them know you are there","Yield only if they have started crossing"],a:1,e:"You must stop and remain stopped for a pedestrian using a white cane or guide dog until they have fully crossed.",src:"CVC 21963"},
  {t:"Right-of-Way",q:"When an emergency vehicle with sirens and lights approaches, you must:",o:["Only yield if directly behind you","Pull to the right and stop until it passes","Only yield on freeways","Only yield if coming from the opposite direction"],a:1,e:"When an emergency vehicle approaches from any direction, pull to the right edge and stop until it passes.",src:"CVC 21806"},
  {t:"Right-of-Way",q:"Who has the right of way when merging onto a freeway?",o:["The merging vehicle","Vehicles already on the freeway","Whoever is going faster","The vehicle on the right"],a:1,e:"Vehicles already on the freeway have the right of way. Merging drivers must yield and find a safe gap.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"You are driving on a two-lane road. A vehicle ahead stops for a pedestrian. You should:",o:["Pass the stopped vehicle carefully","Honk to alert the pedestrian","Not pass - the pedestrian may be in your lane","Flash your lights"],a:2,e:"Never pass a stopped vehicle at a crosswalk - the pedestrian may be stepping into your lane.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"At a T-intersection with no signs or signals, who has the right of way?",o:["The driver on the through road always","The driver on the terminating road","Whoever arrives first","The driver on the right"],a:0,e:"At a T-intersection, traffic on the through road has the right of way over vehicles on the terminating dead-end road.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"Two vehicles meet on a steep narrow road and neither can pass. Who must back up?",o:["The vehicle going uphill","The vehicle going downhill","The larger vehicle","The vehicle that arrived last"],a:1,e:"The vehicle facing downhill must back up because it has more control when backing on a hill.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"While waiting to turn left at an intersection, your wheels should be:",o:["Turned left ready to complete the turn","Turned right as a safety precaution","Pointed straight ahead until it is safe to turn","It does not matter"],a:2,e:"Keep your wheels pointed straight ahead while waiting to turn left. If rear-ended with wheels turned, you could be pushed into oncoming traffic.",src:"Handbook S6"},
  {t:"DUI & Alcohol Laws",q:"At what BAC are drivers under 21 legally impaired in California?",o:["0.08%","0.04%","0.01%","0.05%"],a:2,e:"Zero-tolerance law: A BAC of 0.01% or higher is illegal for drivers under 21.",src:"CVC 23136"},
  {t:"DUI & Alcohol Laws",q:"Refusing a chemical test after a lawful DUI arrest results in:",o:["No penalty if you are sober","Mandatory license suspension","Applies to breathalyzer only","Does not apply to drivers over 21"],a:1,e:"Under California implied consent law, refusing a chemical test after a lawful DUI arrest results in mandatory license suspension.",src:"CVC 23612"},
  {t:"DUI & Alcohol Laws",q:"What is the legal BAC limit for non-commercial drivers 21 and older?",o:["0.04%","0.06%","0.08%","0.10%"],a:2,e:"The legal BAC limit for drivers 21 and older in a non-commercial vehicle is 0.08%.",src:"CVC 23152"},
  {t:"DUI & Alcohol Laws",q:"What is the legal BAC limit for commercial vehicle drivers?",o:["0.08%","0.04%","0.02%","0.01%"],a:1,e:"Commercial vehicle drivers face a stricter BAC limit of 0.04%.",src:"CVC 23152(d)"},
  {t:"DUI & Alcohol Laws",q:"An open container of alcohol in a vehicle must be stored:",o:["In the glove compartment","In a bag or box","In the trunk or area not accessible to the driver","It is always illegal to have any open container"],a:2,e:"Open containers of alcohol must be stored in the trunk or an area not accessible to the driver or passengers.",src:"CVC 23225"},
  {t:"DUI & Alcohol Laws",q:"A DUI conviction stays on your California driving record for how many years?",o:["3 years","5 years","7 years","10 years"],a:3,e:"A DUI conviction stays on your California driving record for 10 years.",src:"Handbook S9"},
  {t:"DUI & Alcohol Laws",q:"Which of the following can make you impaired even if your BAC is under the legal limit?",o:["Energy drinks","Prescription medications that cause drowsiness","Caffeine","All over-the-counter medications"],a:1,e:"Prescription medications that cause drowsiness or impair judgment can make you an unsafe driver even if your BAC is under 0.08%.",src:"Handbook S9"},
  {t:"Headlights & Visibility",q:"When must you use your headlights?",o:["Only at night","30 min after sunset to 30 min before sunrise and when visibility is under 1000 feet","Only in fog or rain","Only on highways"],a:1,e:"Headlights required from 30 min after sunset to 30 min before sunrise and whenever visibility is under 1000 feet.",src:"Handbook S5"},
  {t:"Headlights & Visibility",q:"When driving in fog you should use:",o:["High-beams for maximum visibility","No lights - they reflect off fog","Low-beam headlights or fog lights","Hazard lights and high beams"],a:2,e:"In fog, use low-beam headlights or fog lights. High beams reflect off fog and reduce visibility.",src:"Handbook S8"},
  {t:"Headlights & Visibility",q:"Dim your high beams when an oncoming vehicle is within how many feet?",o:["200 feet","300 feet","500 feet","1000 feet"],a:2,e:"Dim high-beam headlights to low beams within 500 feet of an oncoming vehicle.",src:"Handbook S5"},
  {t:"Headlights & Visibility",q:"Dim your high beams when following another vehicle within how many feet?",o:["100 feet","200 feet","300 feet","500 feet"],a:2,e:"Dim high beams within 300 feet of a vehicle you are following.",src:"Handbook S5"},
  {t:"Headlights & Visibility",q:"When must you turn on headlights while using windshield wipers?",o:["Only in heavy rain","Whenever wipers are in use due to weather","Only at night in rain","Only when visibility drops below 500 feet"],a:1,e:"If you use windshield wipers due to fog, rain, or snow, you must turn on your low-beam headlights.",src:"Handbook S5"},
  {t:"Headlights & Visibility",q:"It is illegal to drive using only:",o:["Low-beam headlights","High-beam headlights","Parking lights or fog lights alone","Daytime running lights"],a:2,e:"It is illegal to drive using only parking lights or fog lights. You must use regular headlights when required.",src:"Handbook S5"},
  {t:"Passing & Lane Rules",q:"You may drive in a bike lane:",o:["Anytime if no cyclists are present","No more than 200 feet before making a right turn","To pass slow traffic","Never"],a:1,e:"You may enter a bike lane no more than 200 feet before the corner or driveway to make a right turn.",src:"CVC 21209"},
  {t:"Passing & Lane Rules",q:"When can you pass on the right?",o:["Whenever the left lane is blocked","When the vehicle ahead is turning left and a lane exists to the right","On any two-lane road","Never"],a:1,e:"You may pass on the right when the vehicle ahead is making a left turn and a usable lane exists to the right.",src:"CVC 21755"},
  {t:"Passing & Lane Rules",q:"Three-point turns are illegal when:",o:["Always legal on any road","You cannot be seen for 200 feet in both directions","Only illegal in school zones","You should always use a driveway"],a:1,e:"Three-point turns are illegal when visibility is less than 200 feet in either direction, such as on hills or curves.",src:"CVC 22102"},
  {t:"Passing & Lane Rules",q:"On a freeway you should signal for at least how long before changing lanes?",o:["100 feet","Five seconds","Three seconds","As soon as you move over"],a:1,e:"On a freeway, signal for at least five seconds before changing lanes to give adequate notice.",src:"Handbook S8"},
  {t:"Passing & Lane Rules",q:"When is it legal to use a carpool HOV lane?",o:["Anytime traffic is heavy","When your vehicle meets the minimum occupancy shown on signs or has a qualifying clean-air sticker","Only during rush hour","Motorcycles may always use HOV lanes"],a:1,e:"HOV lanes require the minimum occupancy posted. Some clean-air vehicles with a qualifying DMV sticker may use them solo.",src:"CVC 21655.5"},
  {t:"Passing & Lane Rules",q:"Slower drivers on a multi-lane road should use:",o:["Any lane","The lanes closest to the center","The lanes closest to the right curb","The leftmost lane"],a:2,e:"Slower drivers should keep to the right lanes. Left lanes are for passing or faster traffic.",src:"CVC 21654"},
  {t:"Passing & Lane Rules",q:"A white diamond painted in a lane indicates:",o:["A turning lane","A carpool or HOV lane","A bike lane","A bus-only lane"],a:1,e:"A white diamond marks a carpool HOV lane reserved for vehicles meeting the required occupancy.",src:"CVC 21655.5"},
  {t:"Passing & Lane Rules",q:"You may cross a double yellow center line:",o:["Never - it is always illegal","To turn left into a driveway or road","To pass a slow vehicle","Only on one-lane roads"],a:1,e:"You may cross a double yellow line to turn left into a driveway or private road. You may not cross it to pass.",src:"CVC 21460"},
  {t:"Passing & Lane Rules",q:"How far before a turn must you signal on a surface street?",o:["50 feet","100 feet","200 feet","300 feet"],a:1,e:"You must signal at least 100 feet before making a turn on a surface street.",src:"Handbook S5"},
  {t:"Passing & Lane Rules",q:"You are driving slowly on a two-lane mountain road and 5 or more vehicles are behind you. You should:",o:["Maintain your speed - you have the right of way","Speed up to keep traffic moving","Pull into a turnout area to let the vehicles behind you pass","Use your hazard lights and continue"],a:2,e:"When driving slowly on a two-lane road with 5 or more vehicles behind you where passing is unsafe, you must use a turnout area or lane to allow them to pass.",src:"Handbook S6"},
  {t:"DMV & Registration",q:"You must notify the DMV within how many days of selling or transferring your vehicle?",o:["5 days","10 days","15 days","30 days"],a:0,e:"You must notify the DMV within 5 days of selling or transferring your vehicle.",src:"Handbook S1"},
  {t:"DMV & Registration",q:"When you move to California you must get a CA driver's license within:",o:["30 days","60 days","10 days","90 days"],a:2,e:"New California residents must obtain a CA driver's license within 10 days of establishing residency.",src:"Handbook S1"},
  {t:"DMV & Registration",q:"How often must you renew your California driver's license?",o:["Every 2 years","Every 3 years","Every 5 years","Every 10 years"],a:2,e:"California driver's licenses are renewed every 5 years.",src:"Handbook S4"},
  {t:"DMV & Registration",q:"You must report a traffic accident to the DMV within how many days if there is injury, death, or damage over $1000?",o:["5 days","10 days","30 days","60 days"],a:1,e:"File an accident report (SR-1) with the DMV within 10 days of an accident involving injury, death, or property damage over $1000.",src:"CVC 16000"},
  {t:"DMV & Registration",q:"You are allowed how many attempts to pass the knowledge test before you must reapply?",o:["2 attempts","3 attempts","5 attempts","Unlimited attempts"],a:1,e:"You are allowed 3 attempts to pass the knowledge test. After 3 failures you must reapply and pay the fee again.",src:"Handbook S3"},
  {t:"Freeway Driving",q:"If you miss your freeway exit you should:",o:["Stop on the shoulder and back up","Cut across the painted gore area","Continue to the next exit and turn around","Slow down and wait for a gap"],a:2,e:"Continue to the next exit. Backing up on a freeway or crossing gore areas is illegal and extremely dangerous.",src:"Handbook S8"},
  {t:"Freeway Driving",q:"A large truck signals to merge into your lane. You should:",o:["Speed up so it cannot merge","Honk to warn the driver","Slow down and allow extra space for the truck to merge safely","Move into another lane immediately"],a:2,e:"Large trucks have significant blind spots. Slowing down and giving the truck space to merge safely is the correct action.",src:"Handbook S7"},
  {t:"Freeway Driving",q:"Driving too slowly on a freeway is:",o:["Always legal if cautious","Illegal if it impedes the normal flow of traffic","Only illegal in the fast lane","Always legal for new drivers"],a:1,e:"There is no fixed minimum speed, but driving so slowly as to impede the normal flow of traffic is illegal in California.",src:"CVC 22400"},
  {t:"Freeway Driving",q:"When entering a freeway you should:",o:["Stop and wait for a gap","Accelerate to match freeway traffic speed and merge safely","Enter at 35 mph and gradually speed up","Use the shoulder to build speed"],a:1,e:"Use the on-ramp to match freeway traffic speed, then merge smoothly into a safe gap.",src:"Handbook S8"},
  {t:"Freeway Driving",q:"You should NOT stop on a freeway except:",o:["When traffic is slow","When you need to check your phone","In a genuine emergency or when directed by law enforcement","When you are tired"],a:2,e:"Never stop on a freeway except in a genuine emergency or when directed by law enforcement.",src:"Handbook S8"},
  {t:"Emergency Situations",q:"What should you do if your accelerator sticks while driving?",o:["Immediately turn off the ignition","Shift to neutral, brake carefully, and pull off the road","Press the accelerator harder to free it","Pump the brakes rapidly"],a:1,e:"Shift to neutral, apply brakes carefully, pull off the road. Turning off the ignition can lock the steering wheel.",src:"Handbook S8"},
  {t:"Emergency Situations",q:"Your brakes fail while driving. What should you do first?",o:["Turn off the engine","Pump the brakes rapidly - they may build back up","Immediately steer off the road","Apply the parking brake hard and fast"],a:1,e:"Pump the brakes rapidly first - this can restore hydraulic pressure. If that fails, downshift and use the parking brake gently.",src:"Handbook S8"},
  {t:"Emergency Situations",q:"If you have a tire blowout while driving you should:",o:["Brake hard immediately","Steer straight, ease off the accelerator gradually, and pull off safely","Turn sharply to the nearest shoulder","Accelerate briefly to stabilize"],a:1,e:"Grip the wheel firmly, steer straight, gradually ease off the accelerator, and pull off the road slowly.",src:"Handbook S8"},
  {t:"Emergency Situations",q:"You are approaching a green light but traffic is backed up into the intersection. You should:",o:["Proceed - you have right of way on green","Honk and proceed slowly","Not enter if you cannot clear the intersection before the light changes","Turn right instead"],a:2,e:"Do not enter an intersection unless you can get completely across before the signal turns red.",src:"Handbook S7"},
  {t:"Emergency Situations",q:"If your vehicle starts to skid you should:",o:["Brake hard and steer away from the skid","Steer in the direction you want to go and ease off the accelerator","Accelerate out of the skid","Turn sharply in the opposite direction"],a:1,e:"In a skid, steer in the direction you want to go and ease off the gas. Braking hard can worsen the skid.",src:"Handbook S8"},
  {t:"Emergency Situations",q:"If your engine stalls on a railroad crossing you should:",o:["Stay in the vehicle and wait for help","Try to restart the engine for up to 3 minutes","Get everyone out and move well away from the tracks immediately","Push the vehicle off the tracks"],a:2,e:"Get everyone out of the vehicle immediately and move well away from the tracks at an angle - not parallel to them.",src:"Handbook S8"},
  {t:"Sharing the Road",q:"When passing a bicyclist on a road you must give at least:",o:["1 foot","2 feet","3 feet","5 feet"],a:2,e:"California Three Feet for Safety Act (CVC 21760): at least 3 feet of clearance when passing a bicyclist.",src:"CVC 21760"},
  {t:"Sharing the Road",q:"When a school bus has red lights flashing and stop arm extended on a two-lane road you must:",o:["Slow to 15 mph and proceed","Stop from BOTH directions until lights stop and arm retracts","Only stop if behind the bus","Stop only if children are visible"],a:1,e:"On a two-lane road, ALL traffic in BOTH directions must stop for a school bus with flashing red lights and extended stop arm.",src:"CVC 22454"},
  {t:"Sharing the Road",q:"On a divided highway with a raised physical divider must you stop for a school bus on the other side?",o:["Yes always stop","No - not required if there is a raised physical divider","Only if the bus is visible","Only during school hours"],a:1,e:"On a divided highway with a physical barrier, you do not need to stop for a school bus in the opposite direction.",src:"CVC 22454"},
  {t:"Sharing the Road",q:"You are driving through a work zone. You should:",o:["Maintain your normal speed","Slow down, increase following distance, and be prepared to stop","Speed up to get through quickly","Use your horn to alert workers"],a:1,e:"In work zones slow down, stay alert, and increase following distance. Traffic fines are doubled in work zones.",src:"Handbook S8"},
  {t:"Sharing the Road",q:"When you hear a siren but cannot see the emergency vehicle you should:",o:["Continue at current speed until you see it","Pull over to the right and stop just in case","Speed up to clear the intersection","Flash hazard lights and slow down"],a:1,e:"If you hear a siren but cannot see the vehicle, pull over to the right and stop. It may approach from any direction.",src:"CVC 21806"},
  {t:"Sharing the Road",q:"Lane splitting by motorcyclists in California is:",o:["Illegal at all times","Legal when traffic is moving slowly and done safely","Legal only on freeways","Legal only if the speed limit is under 65 mph"],a:1,e:"Lane splitting is legal in California when done safely. California is unique among US states in permitting this.",src:"CVC 21658.1"},
  {t:"Sharing the Road",q:"You hit a parked vehicle and cannot find the owner. You should:",o:["Drive away - it was not your fault","Call police and wait","Leave a note with your name and contact information on the vehicle and report to police","Take a photo and drive away"],a:2,e:"If you hit a parked vehicle and cannot find the owner, you must leave a note with your name, address, and contact info, then report the incident to local police.",src:"CVC 20002"},
  {t:"Sharing the Road",q:"It is illegal to leave a child 6 years old or younger unattended in a vehicle unless:",o:["You will return in less than 5 minutes","The engine is off","A person at least 12 years old remains with the child","The windows are cracked open"],a:2,e:"You may not leave a child 6 or younger unattended in a vehicle unless supervised by a person who is at least 12 years old.",src:"CVC 15620"},
  {t:"Distances & Measurements",q:"When parallel parking your wheels must be within how many inches of the curb?",o:["6 inches","12 inches","18 inches","24 inches"],a:2,e:"Your vehicle must be parallel and within 18 inches of the curb.",src:"Handbook S6"},
  {t:"Distances & Measurements",q:"Stop no closer than how many feet from a railroad crossing when a train is approaching?",o:["10 feet","15 feet","25 feet","50 feet"],a:1,e:"Stop no closer than 15 feet from the nearest rail when a train is approaching.",src:"CVC 22451"},
  {t:"Distances & Measurements",q:"No parking within how many feet of a fire hydrant?",o:["10 feet","15 feet","20 feet","25 feet"],a:1,e:"CVC 22514: No parking within 15 feet of a fire hydrant.",src:"CVC 22514"},
  {t:"Distances & Measurements",q:"No parking within how many feet of a crosswalk at an intersection?",o:["10 feet","15 feet","20 feet","25 feet"],a:2,e:"No parking within 20 feet of a crosswalk at an intersection.",src:"Handbook S6"},
  {t:"Distances & Measurements",q:"You may enter a bike lane no more than how many feet before a right turn?",o:["100 feet","150 feet","200 feet","300 feet"],a:2,e:"You may only enter a bike lane within 200 feet of the corner or driveway where you will turn right.",src:"CVC 21209"},
  {t:"Distances & Measurements",q:"Dim high beams when an oncoming vehicle is within how many feet?",o:["200 feet","300 feet","500 feet","1000 feet"],a:2,e:"Dim high-beam headlights within 500 feet of an oncoming vehicle.",src:"Handbook S5"},
  {t:"Distances & Measurements",q:"Dim high beams when following another vehicle within how many feet?",o:["100 feet","200 feet","300 feet","500 feet"],a:2,e:"Dim high beams within 300 feet of a vehicle you are following.",src:"Handbook S5"},
  {t:"Distances & Measurements",q:"Three-point turns are illegal when you cannot be seen for how many feet in both directions?",o:["100 feet","150 feet","200 feet","300 feet"],a:2,e:"Three-point turns are illegal when visibility is less than 200 feet in either direction.",src:"CVC 22102"},
  {t:"Distances & Measurements",q:"Stop at least how many feet from a school bus with flashing red lights?",o:["10 feet","20 feet","25 feet","50 feet"],a:1,e:"Stop at least 20 feet away from a school bus with flashing red lights and extended stop arm.",src:"CVC 22454"},
  {t:"Distances & Measurements",q:"When passing a bicyclist you must give at least how many feet of clearance?",o:["1 foot","2 feet","3 feet","5 feet"],a:2,e:"California Three Feet for Safety Act (CVC 21760): at least 3 feet clearance.",src:"CVC 21760"},
  {t:"Distances & Measurements",q:"On a freeway signal at least how many seconds before changing lanes?",o:["2 seconds","3 seconds","5 seconds","10 seconds"],a:2,e:"Signal for at least 5 seconds before changing lanes on a freeway.",src:"Handbook S8"},
  {t:"Distances & Measurements",q:"Headlights are required when visibility drops below how many feet?",o:["500 feet","750 feet","1000 feet","1500 feet"],a:2,e:"Use headlights when it is too dark to see from 1000 feet away.",src:"Handbook S5"},
  {t:"Distances & Measurements",q:"No parking within how many feet of a railroad crossing?",o:["50 feet","75 feet","100 feet","200 feet"],a:0,e:"Parking is prohibited within 50 feet of the nearest rail of a railroad crossing.",src:"Handbook S6"},
  {t:"Distances & Measurements",q:"Minimum safe following distance at highway speeds is at least:",o:["1 second","2 seconds","3 seconds","5 seconds"],a:2,e:"The 3-second rule is the minimum safe following distance. Increase to 4-6 seconds in bad weather or with large vehicles.",src:"Handbook S8"},
  {t:"Distances & Measurements",q:"How far before a turn must you signal on a surface street?",o:["50 feet","100 feet","200 feet","500 feet"],a:1,e:"Signal at least 100 feet before making a turn on a surface street.",src:"Handbook S5"},
  {t:"Cell Phones & Distractions",q:"Drivers 18 and older may use a cell phone while driving only if:",o:["The call is brief","They use a hands-free device","They are stopped at a red light","The phone is on speaker"],a:1,e:"Drivers 18 and older may only use a cell phone with a hands-free device such as Bluetooth.",src:"CVC 23123"},
  {t:"Cell Phones & Distractions",q:"Drivers under 18 may use a cell phone while driving:",o:["With a hands-free device only","Only for emergency calls","Not at all - even hands-free is prohibited","Only when parked"],a:2,e:"Drivers under 18 are prohibited from using any wireless device while driving - even hands-free.",src:"CVC 23124"},
  {t:"Cell Phones & Distractions",q:"Texting while driving is:",o:["Legal if stopped at a red light","Legal if using voice-to-text","Illegal at all times unless the vehicle is lawfully parked","Legal only on freeways"],a:2,e:"Texting while driving is illegal at all times including when stopped at a red light.",src:"CVC 23123.5"},
  {t:"Cell Phones & Distractions",q:"Which is the most dangerous distraction while driving?",o:["Adjusting the radio","Eating while driving","Texting while driving","Talking to a passenger"],a:2,e:"Texting is the most dangerous because it takes your eyes, hands, and mind off driving simultaneously.",src:"Handbook S5"},
  {t:"Cell Phones & Distractions",q:"You receive an urgent call while driving without a hands-free device. You should:",o:["Answer quickly and keep it short","Let it go to voicemail and pull over safely to return it","Put it on speaker so your hands are free","Answer only if in the slow lane"],a:1,e:"Let the call go to voicemail. Pull off the road safely to return the call.",src:"CVC 23123"},
  {t:"Cell Phones & Distractions",q:"Even hands-free cell phone use while driving is dangerous because:",o:["It is illegal in California","It drains your battery","It takes your mental attention away from driving","It requires looking at the screen"],a:2,e:"Even hands-free calls cause cognitive distraction (inattention blindness), reducing your ability to react to hazards.",src:"Handbook S5"},
  {t:"Roundabouts",q:"In a roundabout traffic travels in which direction?",o:["Clockwise","Counterclockwise","Either direction","Depends on markings"],a:1,e:"In California roundabouts, traffic always travels counterclockwise around the central island.",src:"Handbook S7"},
  {t:"Roundabouts",q:"When entering a roundabout you must yield to:",o:["No one - you have the right of way","Vehicles already in the roundabout","Vehicles waiting on your right","Pedestrians only"],a:1,e:"When entering a roundabout, always yield to all vehicles already circulating inside.",src:"Handbook S7"},
  {t:"Roundabouts",q:"If you miss your exit in a roundabout you should:",o:["Stop and back up","Make a U-turn inside","Continue around and take your exit on the next pass","Exit at the nearest available street"],a:2,e:"If you miss your exit, continue around the roundabout and take your exit when you reach it again. Never stop or reverse.",src:"Handbook S7"},
  {t:"Roundabouts",q:"When driving through a roundabout you should:",o:["Accelerate to keep up with traffic","Maintain a steady slow speed and not stop or pass","Stop if unsure about the exit","Use your horn to signal others"],a:1,e:"Travel at a slow steady speed. Do not stop except to yield at entry and do not pass other vehicles.",src:"Handbook S7"},
  {t:"Roundabouts",q:"When approaching a roundabout you should:",o:["Accelerate to merge quickly","Slow down, yield to traffic inside, and enter when there is a safe gap","Stop and wait for the roundabout to clear completely","Flash headlights to signal entry"],a:1,e:"Slow down as you approach, yield to all traffic in the roundabout, and enter when there is a safe gap.",src:"Handbook S7"},
  {t:"Seat Belts & Child Safety",q:"Who is required to wear a seat belt in California?",o:["Only the driver","The driver and front-seat passengers","The driver and ALL passengers","Only passengers under 18"],a:2,e:"California law CVC 27315 requires the driver and ALL passengers to wear seat belts at all times.",src:"CVC 27315"},
  {t:"Seat Belts & Child Safety",q:"Children under what age must ride in a car seat or booster seat in the back seat?",o:["Under 6","Under 8","Under 10","Under 12"],a:1,e:"Children under 8 must be secured in an appropriate car seat or booster seat in the back seat.",src:"CVC 27360"},
  {t:"Seat Belts & Child Safety",q:"It is illegal to smoke in a vehicle in California when:",o:["On a freeway","A minor under 18 is in the vehicle","The windows are up","You are in a school zone"],a:1,e:"California law prohibits smoking in a vehicle when a minor under 18 is present, regardless of whether windows are open.",src:"CVC 12700"},
  {t:"Seat Belts & Child Safety",q:"A child may ride in the front seat when:",o:["They are 8 years or older","They are at least 4 feet 9 inches tall","They have outgrown all child safety seats","All of the above may apply"],a:0,e:"Children 8 and older may ride in the front seat. The back seat is always safer for children.",src:"CVC 27360"},
  {t:"Seat Belts & Child Safety",q:"Who is responsible if a child under 16 is not wearing a seat belt?",o:["The child","The driver of the vehicle","The parent only","No one unless there is an accident"],a:1,e:"The driver is responsible for ensuring all passengers under 16 are properly restrained.",src:"CVC 27360"},
  {t:"Seat Belts & Child Safety",q:"A rear-facing car seat must NEVER be placed:",o:["In the back seat","In the center of the back seat","In the front seat if there is an active passenger airbag","In a vehicle without airbags"],a:2,e:"A rear-facing car seat must never be placed in the front seat if an active passenger-side airbag is present.",src:"Handbook S5"},
  {t:"Fines & Penalties",q:"Traffic fines in work zones are:",o:["The same as normal violations","Doubled","Tripled","Reduced if work is not in progress"],a:1,e:"Traffic fines are doubled in California construction or work zones, even if workers are not present.",src:"CVC 42009"},
  {t:"Fines & Penalties",q:"What happens if you accumulate too many points on your driving record?",o:["Nothing - points are for record only","Your license may be suspended or revoked","You pay a fine only","You must retake the written test"],a:1,e:"California point system CVC 12810: Too many points such as 4 in 12 months can result in suspension or revocation.",src:"CVC 12810"},
  {t:"Fines & Penalties",q:"You must report a traffic accident to the DMV within how many days?",o:["5 days","10 days","30 days","60 days"],a:1,e:"File a Report of Traffic Accident (SR-1) within 10 days of an accident involving injury, death, or property damage over $1000.",src:"CVC 16000"},
  {t:"Fines & Penalties",q:"If you are involved in an accident you must:",o:["Leave if damage appears minor","Stop, exchange information, and report it if required","Only stop if you caused the accident","Call police only if someone is hurt"],a:1,e:"You must stop, exchange driver and insurance information, and report the accident if required.",src:"CVC 20001"},
  {t:"Fines & Penalties",q:"Driving without a valid driver's license can result in:",o:["A warning only","A fine and possible vehicle impoundment","Loss of registration only","An automatic court appearance"],a:1,e:"Driving without a valid license CVC 12500 can result in a fine and your vehicle being impounded.",src:"CVC 12500"},
  {t:"Fines & Penalties",q:"A DUI conviction stays on your California driving record for:",o:["3 years","5 years","7 years","10 years"],a:3,e:"A DUI conviction stays on your California driving record for 10 years.",src:"Handbook S9"},
  {t:"Fines & Penalties",q:"Illegally passing a stopped school bus is:",o:["An infraction with a small fine","A misdemeanor with significant fines and points","Only illegal if children are visible","Legal if you slow to 15 mph"],a:1,e:"Illegally passing a school bus is a misdemeanor. Fines start at $1000 for a first offense plus 1 point on your record.",src:"CVC 22454"},
  {t:"Adverse Weather",q:"When driving in heavy rain you should:",o:["Maintain your normal highway speed","Increase following distance and reduce speed","Turn on hazard lights and drive normally","Use high-beam headlights for better visibility"],a:1,e:"In heavy rain, slow down and increase your following distance. Rain reduces traction and visibility.",src:"Handbook S8"},
  {t:"Adverse Weather",q:"Hydroplaning occurs when:",o:["Your tires overheat on a hot road","A layer of water builds under your tires causing loss of traction","Your windshield fogs up in rain","Your brakes get wet and fail"],a:1,e:"Hydroplaning happens when water builds up under your tires faster than it can be displaced, causing loss of road contact.",src:"Handbook S8"},
  {t:"Adverse Weather",q:"If your vehicle begins to hydroplane you should:",o:["Brake hard to slow down","Accelerate to spin the water away","Ease off the gas and steer straight until tires regain traction","Turn sharply to the dry lane"],a:2,e:"If hydroplaning, ease off the accelerator gently and steer straight. Braking or turning sharply can cause a skid.",src:"Handbook S8"},
  {t:"Adverse Weather",q:"When driving on steep mountain grades to save your brakes you should:",o:["Pump the brakes frequently","Downshift to a lower gear","Use your parking brake on descents","Shift to neutral on downhill slopes"],a:1,e:"Downshift to a lower gear on steep descents. Engine braking controls speed and reduces wear on your brakes.",src:"Handbook S8"},
  {t:"Adverse Weather",q:"When should you use tire chains in California?",o:["Anytime it is raining heavily","When snow or ice is present and chain controls R-1 R-2 or R-3 are posted","Only on mountain roads above 5000 feet","Chains are never legal in California"],a:1,e:"Tire chains or snow tires are required when Caltrans posts chain controls R-1, R-2, or R-3 on mountain highways due to snow or ice.",src:"Handbook S8"},
  {t:"Adverse Weather",q:"When visibility drops below 100 feet due to fog you should:",o:["Turn on your high beams","Maintain speed so other drivers can track you","Pull completely off the road and turn on your hazard lights until conditions improve","Continue slowly using low beams only"],a:2,e:"If fog becomes too thick to drive safely, pull completely off the road, turn on your emergency flashers, and wait for conditions to improve.",src:"Handbook S8"},
  {t:"Tricky Questions",q:"A blind pedestrian at a crosswalk pulls their cane back and steps AWAY from the intersection. This means:",o:["They are about to cross - yield immediately","They are signaling that you may proceed","They need help and you should stop","They do not see your vehicle - stop and honk"],a:1,e:"When a blind pedestrian pulls in their cane and steps away from the intersection, this gesture usually means you may go. Always remain cautious.",src:"Handbook S7"},
  {t:"Tricky Questions",q:"You are driving 65 mph on a freeway where others are going 70 mph. You should:",o:["Speed up to 70 mph to match traffic flow","Stay at 65 mph - that is the posted maximum","Drive between 65 and 70 mph to match traffic","Speed up to 70 mph since the Basic Speed Law allows it"],a:1,e:"You may never exceed the posted speed limit. Even if traffic is flowing at 70 mph, you must stay at or under the 65 mph posted limit.",src:"CVC 22349"},
  {t:"Tricky Questions",q:"You are turning right from a two-lane one-way street. You must turn from:",o:["The left lane","The center lane","The lane closest to the right curb","Either lane if safe"],a:2,e:"You must begin and end a right turn in the lane closest to the right curb.",src:"Handbook S6"},
  {t:"Tricky Questions",q:"You are turning left from a two-lane one-way street. You must turn from:",o:["The lane closest to the right curb","Any lane if you signal","The lane closest to the center divider","The center lane"],a:2,e:"When turning left on a one-way street, you must begin the turn from the lane closest to the left side.",src:"Handbook S6"},
  {t:"Tricky Questions",q:"A motorcycle's turn signal stays on after a turn. You should:",o:["Pass the motorcycle - the signal is stuck","Assume the motorcycle will turn again soon","Not assume the motorcycle will turn - wait until it actually does","Honk to alert the rider"],a:2,e:"Motorcycles often do not have self-canceling turn signals. Do NOT assume a motorcycle will turn just because its signal is on.",src:"Handbook S7"},
  {t:"Tricky Questions",q:"You are in an intersection waiting to turn left when the signal turns yellow. You should:",o:["Abandon the turn and back out of the intersection","Stop in the intersection until the next green light","Complete your turn - you were already in the intersection lawfully","Immediately turn right instead"],a:2,e:"If you entered the intersection on green and are waiting to turn left when it turns yellow, complete your turn when it is safe.",src:"Handbook S7"},
  {t:"Tricky Questions",q:"When can you make a U-turn in a residential district?",o:["Never - U-turns are illegal everywhere in California","Only at designated U-turn signs","When no vehicle is approaching within 200 feet and it is safe","Only at traffic-light-controlled intersections"],a:2,e:"In a residential district, you may make a U-turn if no vehicle is approaching within 200 feet and the turn can be completed safely.",src:"CVC 22102"},
  {t:"Tricky Questions",q:"You are on a one-way street parking uphill. Which side do you park on and which way do wheels face?",o:["Right side only - wheels right","Left side only - wheels left","Either side - wheels AWAY from the nearest curb","Either side - wheels TOWARD the nearest curb"],a:2,e:"On a one-way street you may park on either side. When parking uphill, turn wheels away from the nearest curb regardless of which side you park on.",src:"Handbook S6"},
  {t:"Tricky Questions",q:"You are already in the intersection when an emergency vehicle with lights approaches. You should:",o:["Stop immediately in the intersection","Continue through the intersection then pull to the right and stop","Reverse out of the intersection","Turn right at the intersection to get out of the way"],a:1,e:"If you are already in the intersection when an emergency vehicle approaches, continue through the intersection, then drive to the right and stop.",src:"Handbook S7"},
  {t:"Tricky Questions",q:"You parked legally but when you return a No Parking sign was placed while you were gone. You:",o:["Must move your vehicle immediately","Are not responsible - the sign was not there when you parked","Can leave your vehicle for up to 30 more minutes","Must move your vehicle within 1 hour"],a:0,e:"Even if a sign is placed after you park, you must comply and move your vehicle as soon as you return.",src:"Handbook S6"},
  {t:"Tricky Questions",q:"Which of the following is true about right turns at a red light in California?",o:["Always allowed after stopping","Allowed after stopping UNLESS a No Turn on Red sign is posted","Never allowed at a red light","Allowed only between 6am and 10pm"],a:1,e:"You may turn right at a red light after a complete stop and yielding to pedestrians and cross traffic - UNLESS a No Turn on Red sign is posted. You may also NOT turn right on a red ARROW.",src:"Handbook S7"},

  // ── DOUBLE PARKING ──
  {t:"Parking Rules",q:"Is double parking ever allowed in California?",o:["Yes, briefly if your hazard lights are on","Yes, if you stay in the vehicle","No - double parking is illegal at all times","Yes, if you are loading or unloading freight"],a:2,e:"Double parking - stopping on the roadway side of a vehicle already parked at the curb - is illegal at all times in California under CVC 22500(h). There are no exceptions for hazard lights or staying in the vehicle.",src:"CVC 22500(h)"},
  {t:"Parking Rules",q:"Double parking means:",o:["Parking in two spaces at once","Parking on the roadway side of a vehicle already parked at the curb","Parking in a no-parking zone twice in one day","Parking facing the wrong direction"],a:1,e:"Double parking means stopping, standing, or parking on the roadway side of another vehicle that is already stopped or parked at the curb or edge of a highway. It is always illegal under CVC 22500(h).",src:"CVC 22500(h)"},
  {t:"Parking Rules",q:"You need to quickly drop off a package. Can you double park with your hazard lights on?",o:["Yes - hazard lights make it legal briefly","Yes - if someone stays in the vehicle","No - double parking is illegal regardless of hazard lights or duration","Yes - if it is a commercial delivery"],a:2,e:"Double parking is illegal at all times under CVC 22500(h). Turning on your hazard lights does not make it legal. Use a legal loading zone or curb space instead.",src:"CVC 22500(h)"},

  // ── ANIMALS IN VEHICLES / TRUCKS ──
  {t:"Sharing the Road",q:"When transporting animals in the back of a pickup truck, you must:",o:["Keep the animal on a short leash tied to the cab","Ensure the animal is properly secured or in a suitable container","Only transport animals if the truck has a cover","Animals are never allowed in the back of a pickup truck"],a:1,e:"California law requires that animals transported in the back of a pickup truck or other open vehicle must be properly secured - in a cage, crate, or otherwise restrained - to prevent them from falling or jumping out.",src:"Handbook S7 / CVC 23117"},
  {t:"Sharing the Road",q:"It is illegal to do which of the following regarding animals on a highway?",o:["Transport animals in a secured cage in a truck bed","Slow down when approaching livestock near the road","Dump or abandon animals on a highway","Feed animals from your vehicle window"],a:2,e:"It is illegal to dump or abandon animals on a highway. This crime is punishable by a fine of up to $1,000, six months in jail, or both.",src:"Handbook S7"},
  {t:"Sharing the Road",q:"You are driving and see a person in charge of horses or livestock near the road. You should:",o:["Maintain your speed - animals are used to traffic","Slow down or stop and follow the directions of the person in charge of the animals","Honk your horn to alert the animals","Move to the far lane and maintain speed"],a:1,e:"When you see animals or livestock near the road, slow down or stop and proceed when it is safe. Follow any directions given by the person in charge of the animals. It is against the law to intentionally scare horses or livestock.",src:"Handbook S7"},

  // ── SLOW-MOVING VEHICLE EMBLEM (orange-red triangle) ──
  {t:"Road Signs",q:"An orange and red triangular emblem on the back of a vehicle means:",o:["The vehicle is carrying hazardous materials","The vehicle is an emergency vehicle","The vehicle travels at 25 mph or less - it is a slow-moving vehicle","The vehicle is oversized and requires extra clearance"],a:2,e:"An orange and red triangle (Slow-Moving Vehicle emblem) on the back of a vehicle means it travels at 25 mph or less. Examples include farm tractors, road maintenance vehicles, and animal-drawn carts. Required by CVC 24615.",src:"Handbook S7 / CVC 24615"},
  {t:"Road Signs",q:"You are approaching a vehicle displaying an orange and red triangular emblem on its rear. You should:",o:["Flash your lights and pass immediately","Expect the vehicle to be traveling at 25 mph or less and slow down","Honk to alert the driver to pull over","Maintain your speed - the vehicle must yield to you"],a:1,e:"The orange and red triangle is the Slow-Moving Vehicle (SMV) emblem. It means the vehicle is designed to travel at 25 mph or less. Slow down and pass only when it is safe to do so.",src:"Handbook S7 / CVC 24615"},
  {t:"Road Signs",q:"Which vehicles are required to display the orange and red slow-moving vehicle triangle?",o:["All vehicles traveling under 45 mph","Vehicles designed to travel at 25 mph or less on public roads","Only farm equipment on rural roads","Emergency vehicles when moving slowly"],a:1,e:"Any vehicle designed and operated at 25 mph or less on public highways is required to display the Slow-Moving Vehicle (SMV) emblem on its rear. This includes farm tractors, road maintenance vehicles, and animal-drawn vehicles.",src:"CVC 24615"},

  // ── POLICE / LAW ENFORCEMENT QUESTIONS ──
  {t:"Right-of-Way",q:"A law enforcement officer signals you to do something that conflicts with an existing traffic sign. You should:",o:["Follow the traffic sign - it is the law","Follow the officer's instructions - they override signs, signals, and laws","Stop and wait until the conflict is resolved","Follow the sign if it is a red light signal"],a:1,e:"You must obey any direction, order, or signal given by a law enforcement officer or firefighter - even if it conflicts with existing signs, signals, or laws. Officers directing traffic have authority over all traffic control devices.",src:"Handbook S7"},
  {t:"Fines & Penalties",q:"You are pulled over and issued a traffic ticket. By signing the ticket you are:",o:["Admitting guilt for the violation","Promising to pay the fine immediately","Promising to appear in court or pay the fine by the due date","Waiving your right to contest the ticket"],a:2,e:"Signing a traffic ticket is NOT an admission of guilt. It is only a written promise to appear in court or pay the fine by the due date. Refusing to sign may result in arrest.",src:"Handbook S12"},
  {t:"Fines & Penalties",q:"What happens if you fail to appear in court after signing a traffic ticket?",o:["Nothing - signing was just a formality","You receive a warning letter from the DMV","Your driving privilege may be suspended until you appear in court","Your ticket is automatically dismissed"],a:2,e:"If you fail to appear (FTA) in court after signing a traffic ticket, the DMV may suspend your driving privilege until you appear. The FTA also goes on your driver record.",src:"Handbook S12"},
  {t:"Fines & Penalties",q:"It is a misdemeanor to use a motor vehicle to flee or evade law enforcement. The penalty can include:",o:["A small fine only","Imprisonment in county jail for up to one year","License suspension for 30 days","Community service only"],a:1,e:"Using a motor vehicle to flee or attempt to evade a law enforcement officer performing their duties is a misdemeanor punishable by imprisonment in a county jail for one year or less. Causing serious injury during a pursuit can result in up to seven years in state prison.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"It is illegal to follow within how many feet of an emergency vehicle that has its siren or flashing lights on?",o:["100 feet","200 feet","300 feet","500 feet"],a:2,e:"It is against the law to follow within 300 feet of any fire engine, law enforcement vehicle, ambulance, or other emergency vehicle when their siren or flashing lights are on.",src:"Handbook S7"},
  {t:"Fines & Penalties",q:"You drive to the scene of a fire or collision out of curiosity. This is:",o:["Legal as long as you do not block emergency vehicles","Legal only if you are a bystander and not interfering","Illegal - you can be arrested for driving to the scene of a fire or disaster","Legal if you park a block away and walk to the scene"],a:2,e:"You can be arrested if you drive to the scene of a fire, collision, or other disaster out of curiosity. Doing so interferes with firefighters, ambulance crews, and other emergency personnel.",src:"Handbook S7"},

  // ── 2026 NEW LAWS ──────────────────────────────────────────────────────────────
  {t:"2026 New Laws",q:"California's expanded Move Over law (AB 390, effective 2026) now requires you to slow down and move over for:",o:["Emergency vehicles with lights and sirens only","Any stationary vehicle displaying hazard lights or warning devices - not just emergency vehicles","Police and fire vehicles only","All vehicles stopped on any road regardless of lights"],a:1,e:"As of January 1, 2026, the Move Over law was expanded to cover ANY stationary vehicle displaying hazard lights, flares, cones, or other warning devices - not just emergency vehicles. You must move over a lane if safe, or slow down significantly if you cannot change lanes.",src:"AB 390 / CVC 21809"},
  {t:"2026 New Laws",q:"What is an Ignition Interlock Device (IID)?",o:["A GPS tracker installed on DUI offenders' vehicles","A breath-activated device that prevents a vehicle from starting if alcohol is detected","A dashboard camera required after a DUI conviction","An alcohol sensor that alerts law enforcement remotely"],a:1,e:"An IID is a breath-activated device installed in a vehicle that prevents the engine from starting if the driver's breath contains alcohol above a set level. California's IID program for DUI offenders has been extended through January 1, 2033.",src:"AB 366"},
  {t:"2026 New Laws",q:"Under California's 2026 IID law, who may be required to install an Ignition Interlock Device?",o:["Only repeat DUI offenders","Only first-time DUI offenders who caused injury","Specified DUI offenders including certain first-time offenders - requirements apply even while a criminal case is pending","Only commercial vehicle drivers convicted of DUI"],a:2,e:"The expanded IID program applies to specified DUI offenders including certain first-time offenders. Critically, DMV penalties including IID requirements operate separately from criminal court - you can face license restrictions before your criminal case is resolved.",src:"AB 366"},
  {t:"2026 New Laws",q:"What is the new probation term for a person convicted of vehicular manslaughter while intoxicated in California (2026)?",o:["Up to 2 years (unchanged)","Between 3 and 5 years (increased from 2 years)","A mandatory 5 years","10 years to match DUI record duration"],a:1,e:"AB 1087 (effective January 1, 2026) increased probation for vehicular manslaughter or gross vehicular manslaughter while intoxicated from 2 years to a term of between 3 and 5 years, aligning with regular DUI probation terms.",src:"AB 1087"},
  {t:"2026 New Laws",q:"Starting January 1, 2026, local governments in California may now operate automated cameras to issue civil penalties for:",o:["Speeding violations","Red-light violations","Lane splitting violations","School zone violations"],a:1,e:"SB 720 (effective January 1, 2026) allows local jurisdictions to operate automated traffic enforcement systems to issue civil penalties for red-light violations, subject to strict limitations and oversight requirements.",src:"SB 720"},
  {t:"2026 New Laws",q:"The school zone speed limit in California is currently 25 mph. When will it change to 20 mph statewide?",o:["January 1, 2026","January 1, 2028","January 1, 2031","It is already 20 mph statewide"],a:2,e:"AB 382 lowers the default school zone speed limit from 25 mph to 20 mph beginning January 1, 2031. However, individual communities may adopt 20 mph limits earlier. Some areas, like parts of Los Angeles County, have already gone to 15 mph. Always check posted signs near schools.",src:"AB 382"},

  // ── SMOG CHECK ─────────────────────────────────────────────────────────────────
  
  

  // ── DAYS-RELATED GAPS ──────────────────────────────────────────────────────────
  {t:"DMV & Registration",q:"When you buy a vehicle in California, how many days do you have to transfer the title into your name?",o:["5 days","10 days","30 days","60 days"],a:1,e:"The buyer has 10 days from the date of purchase to transfer title to their name at the DMV. The seller separately must notify the DMV within 5 days of the sale. These are two distinct deadlines for each party.",src:"Handbook S11"},
  {t:"DUI & Alcohol Laws",q:"After a DUI arrest in California, how many days do you have to request a DMV hearing to challenge your license suspension?",o:["5 days","10 days","30 days","60 days"],a:1,e:"After a DUI arrest, you have only 10 days to contact the DMV and request a hearing to challenge your license suspension. If you do not request a hearing within 10 days, your license will be automatically suspended. DMV and criminal court actions are separate proceedings.",src:"CVC 13353.2"},
  {t:"DMV & Registration",q:"If you fail the California DMV knowledge test, how long must a driver under 18 wait before retaking it?",o:["Next business day","7 days","14 days","30 days"],a:1,e:"Drivers under 18 must wait 7 days before retaking the knowledge test after a failure. Drivers 18 and older may retake the test the next business day. You are allowed 3 total attempts before you must reapply and pay the fee again.",src:"Handbook S3"},

  // ── FINES-RELATED GAPS ─────────────────────────────────────────────────────────
  
  {t:"Fines & Penalties",q:"What is the fine for obstructing, altering, or covering a license plate in California (2026)?",o:["$250","$500","Up to $1,000","Up to $2,500"],a:2,e:"Under 2026 California law, manufacturing, distributing, or using a device to obstruct or alter the reading of a license plate carries a fine of up to $1,000. This includes covers, sprays, or other devices that block automated plate readers.",src:"2026 CA Law"},
  {t:"Fines & Penalties",q:"If you are involved in a hit-and-run that causes only property damage with no injuries, this is:",o:["An infraction with a small fine only","A misdemeanor punishable by up to 6 months in jail and/or a $1,000 fine","A felony in all circumstances","Only illegal if the damage exceeds $1,000"],a:1,e:"Leaving the scene of an accident involving only property damage (no injury) is a misdemeanor under CVC 20002, punishable by up to 6 months in county jail and/or a fine of up to $1,000. If injury or death is involved, it becomes a felony with much greater penalties.",src:"CVC 20002"},
  {t:"Fines & Penalties",q:"What is the fine for a traffic violation committed in a Safety Enhanced-Double Fine Zone in California?",o:["The same as a normal violation","Double the normal fine","Triple the normal fine","A flat $1,000 regardless of violation type"],a:1,e:"Certain roads with high collision-related injuries are designated Safety Enhanced-Double Fine Zones. Traffic fines in these zones are doubled. Work zones also carry doubled fines.",src:"Handbook S7"},

  // ── DISTANCE-RELATED GAPS ──────────────────────────────────────────────────────
  {t:"Distances & Measurements",q:"No parking is allowed within how many feet of a fire station driveway on the same side of the street?",o:["10 feet","15 feet","20 feet","30 feet"],a:2,e:"You may not park within 20 feet of a fire station driveway entrance on the same side of the street. On the opposite side, the restriction is within 75 feet. This is a distinct rule from the 15-foot fire hydrant restriction.",src:"CVC 22500"},
  {t:"Distances & Measurements",q:"No parking is allowed within how many feet of a stop sign?",o:["15 feet","20 feet","30 feet","50 feet"],a:2,e:"California law prohibits parking within 30 feet of a stop sign. This is different from the 20-foot crosswalk rule and the 15-foot fire hydrant rule - all three are commonly confused on the test.",src:"CVC 22500"},
  {t:"Distances & Measurements",q:"You may enter a two-way center left turn lane no more than how many feet before your turn?",o:["100 feet","150 feet","200 feet","300 feet"],a:2,e:"You may only enter a two-way center left turn lane within 200 feet of your intended turn. This shared lane is for left turns in both directions - do not use it as a travel lane or merge lane.",src:"CVC 21460.5"},

  // ── T-INTERSECTION GAPS ────────────────────────────────────────────────────────
  {t:"Right-of-Way",q:"You are on the terminating (dead-end) road at a T-intersection with no signs. Who must you yield to?",o:["Only vehicles approaching from your left","Only vehicles approaching from your right","All vehicles, bicyclists, and pedestrians on the through road","Whoever arrived at the intersection first"],a:2,e:"At a T-intersection without STOP or YIELD signs, the driver on the terminating road MUST yield to all vehicles, bicyclists, and pedestrians on the through road. This is different from a 4-way uncontrolled intersection where first-arrival and right-side rules apply.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"At a T-intersection without signs, a pedestrian is crossing the through road. Who has priority?",o:["The vehicle on the through road, as it has right of way over the terminating road","The vehicle that arrived at the intersection first","The pedestrian always has priority over all vehicles","The vehicle turning left from the through road"],a:2,e:"Pedestrians always have the right of way in crosswalks at any intersection, including T-intersections. Even though vehicles on the through road have right of way over vehicles on the terminating road, pedestrians crossing the through road still have priority over those vehicles.",src:"Handbook S7"},
  {t:"Right-of-Way",q:"At a T-intersection, a vehicle on the through road and a vehicle on the terminating road arrive at exactly the same time. What is the rule?",o:["The vehicle on the right always goes first, same as a 4-way stop","The vehicle on the through road always has right of way regardless of arrival time","The vehicle on the terminating road may go first since it waited longer","They may both proceed simultaneously if going in different directions"],a:1,e:"At a T-intersection, the through road has right of way at all times regardless of when vehicles arrive. This is unlike a 4-way uncontrolled intersection where first-arrival or right-side rules determine priority. The terminating road driver must always yield.",src:"Handbook S7"},

  // ── ILLEGAL ITEMS ──────────────────────────────────────────────────────────────
  {t:"Carrying Illegal Items",q:"How must a handgun be legally transported in a vehicle in California?",o:["Loaded, in a locked glove compartment","Unloaded, in a locked container or the vehicle's trunk - not in the glove compartment","Unloaded and visible on the seat to show it is not concealed","Loaded if you have a valid hunting license"],a:1,e:"A handgun must be unloaded and stored in a fully enclosed locked container (padlock, key lock, or combination lock) or in the trunk. The glove compartment does NOT qualify as a locked container under California law, even if it has a lock.",src:"Penal Code 25610"},
  {t:"Carrying Illegal Items",q:"Why does the glove compartment NOT satisfy California's requirement for storing a handgun in a vehicle?",o:["It is too close to the driver","It does not qualify as a locked container under California law","It is only acceptable if the vehicle has no trunk","It is acceptable as long as the glove compartment is locked"],a:1,e:"California law defines a locked container as a secure container fully enclosed and locked. The glove compartment (and utility compartment) are specifically excluded from this definition under Penal Code 16850, even if they have a lock. The trunk or a separate locked hard case must be used.",src:"Penal Code 16850"},
  {t:"Carrying Illegal Items",q:"You allow a friend to place a firearm in your vehicle knowing it violates California law. As the vehicle owner you are:",o:["Not responsible - you did not bring the firearm yourself","Responsible - it is unlawful to knowingly permit another person to bring a firearm into your vehicle in violation of the law","Only responsible if you are driving at the time","Responsible only if the firearm is loaded"],a:1,e:"California law makes it unlawful for a driver or owner of a vehicle to knowingly permit another person to carry or bring a firearm into the vehicle in violation of the law. Ownership of the vehicle creates responsibility even if you personally did not possess the firearm.",src:"Penal Code 26100"},
  {t:"Carrying Illegal Items",q:"Recreational marijuana is legal in California. Is it legal to use marijuana while driving?",o:["Yes, if you are a passenger","Yes, if the amount is within the legal possession limit","No - driving under the influence of marijuana is illegal regardless of recreational legality","Yes, if your BAC is under 0.08%"],a:2,e:"While recreational marijuana is legal for adults 21+ in California, driving under the influence of marijuana is illegal. It is also illegal for any occupant to smoke or consume marijuana in a moving vehicle. Open containers of cannabis must be stored in the trunk or an area inaccessible to the driver.",src:"CVC 23222 / Handbook S9"},

  // ── STATE-TO-STATE DIFFERENCES ─────────────────────────────────────────────────
  {t:"California-Specific Rules",q:"You move to California and hold a valid driver's license from another state. Once you establish California residency, your out-of-state license:",o:["Remains valid for driving in California for up to 1 year","Is valid for 60 days then automatically expires","Is no longer valid for driving in California - you must obtain a CA license within 10 days","Remains valid indefinitely unless you choose to switch"],a:2,e:"Once you establish residency in California, your out-of-state license is no longer valid for driving in California. You must obtain a California driver's license within 10 days of becoming a resident. You may use the out-of-state license as ID but not to drive.",src:"Handbook S1"},
  
  {t:"California-Specific Rules",q:"Which of the following is a driving rule that is UNIQUE to California compared to most other US states?",o:["Right turn on red after a full stop is permitted","Drivers 21+ face a 0.08% BAC limit","Motorcycle lane splitting is explicitly legal when done safely","A 3-second following distance is recommended"],a:2,e:"Lane splitting (motorcycles riding between lanes of slow or stopped traffic) is legal in California and California is unique among all 50 US states in explicitly permitting this. The 0.08% BAC limit is the federal standard adopted by all states. Right on red is legal in most US states. The 3-second rule is universally recommended.",src:"CVC 21658.1"},

  // ── PARKING GAPS ───────────────────────────────────────────────────────────────
  {t:"Parking Rules",q:"It is illegal to park facing oncoming traffic on a two-way street because:",o:["Your headlights would blind oncoming drivers","It is illegal - your vehicle must be parked in the same direction as traffic flow on that side of the road","It increases the risk of door-opening accidents","All of the above"],a:1,e:"On a two-way street you must park in the same direction as traffic flow on the side of the road you are on. Parking facing oncoming traffic is illegal. The exception is a one-way street where you may park on either side.",src:"CVC 22502"},

  {t:"Tricky Questions",q:"You are approaching a red light and want to turn right. There is no No Turn on Red sign. You may turn right:",o:["Without stopping since you are turning, not going straight","After coming to a complete stop and yielding to pedestrians and cross traffic","Only if no cars are coming from either direction","Only between 6am and 10pm"],a:1,e:"You may turn right at a red light after making a complete stop, checking for pedestrians and cross traffic, and yielding to all. This is only allowed if there is NO No Turn on Red sign posted. You may NEVER turn right on a red arrow signal, even with no sign.",src:"Handbook S7"},
  {t:"Tricky Questions",q:"On a two-lane mountain road where you are driving slowly and cannot let others pass, what must you do when 5 or more vehicles have backed up behind you?",o:["Speed up to maintain a safe distance ahead of the queue","Turn on your hazard lights and continue at your current speed","Pull into the nearest turnout to let the vehicles pass - this is required by law","It is the other drivers' responsibility to find a safe passing opportunity"],a:2,e:"California law requires you to use a turnout area or lane when driving at a speed that impedes the normal flow of traffic and 5 or more vehicles are following. Simply turning on hazard lights is not sufficient - you must actually pull over and let traffic pass.",src:"CVC 21656"},

  // ── FREEWAY GAPS ───────────────────────────────────────────────────────────────
  {t:"Freeway Driving",q:"Your vehicle breaks down on a freeway. What is the correct sequence of actions?",o:["Stop in your lane and turn on hazard lights - never drive on the shoulder","Pull as far to the right shoulder as possible, turn on hazard lights, and if safe exit and stand well away from traffic","Stop in the far-right lane, turn on hazard lights, and wait in the vehicle","Pull onto the shoulder only if you can see an emergency phone nearby"],a:1,e:"If you break down on a freeway: move as far right onto the shoulder as possible, turn on hazard lights, set out warning flares or triangles if available. If it is safe to exit the vehicle, get out and stand well away from traffic - on the other side of a guardrail if possible. Never stand between your vehicle and oncoming traffic.",src:"Handbook S8"},
