  // ── ROAD SIGNS GAPS ────────────────────────────────────────────────────────────
  {t:"Road Signs",q:"What does a 'Shoulder Work Ahead' or 'Road Work Ahead' orange sign mean?",o:["Slow down and merge left immediately","Workers or equipment are present ahead - slow down, increase following distance, and expect lane changes or stopped vehicles","The road is closed - turn around","A detour is mandatory ahead"],a:1,e:"Orange work zone signs warn of construction or maintenance activity ahead. When you see them, slow down, increase your following distance, expect sudden stops, and watch for workers and equipment near or in the road. Fines for violations in active work zones are $1,000 or more.",src:"Handbook S7"},
  {t:"Road Signs",q:"A yellow diamond sign showing a car with wavy lines beneath it means:",o:["Winding road ahead - expect several curves","Hill ahead - shift to lower gear","Road may be slippery when wet - reduce speed and increase following distance","Uneven pavement or bumps ahead"],a:2,e:"The Slippery When Wet sign (yellow diamond with a skidding car) warns that the road surface becomes slippery in wet conditions. Reduce speed, avoid hard braking or sudden steering changes, and increase following distance. This is commonly confused with the Winding Road sign which shows an S-curve arrow.",src:"Handbook S7"},
  {t:"Road Signs",q:"What does a yellow diamond sign with two arrows pointing away from each other (splitting apart) mean?",o:["Divided highway ends - two-way traffic resumes","Divided highway begins ahead - keep right, a median or barrier will separate traffic","Two lanes merge into one ahead","Road forks - choose your direction"],a:1,e:"The Divided Highway Begins sign warns you are about to enter a section of road with a physical median or barrier separating traffic. Keep to the right-hand road. The arrows point apart (splitting) to show the road is about to be divided. The arrows coming together would mean Divided Highway Ends.",src:"Handbook S7"},
  {t:"Road Signs",q:"What does a yellow diamond sign with two arrows pointing toward each other (coming together) mean?",o:["Divided highway begins - keep right","Divided highway ends - undivided two-way road resumes ahead","Two roads merge into one from both sides","Lane narrows - prepare to stop"],a:1,e:"The Divided Highway Ends sign warns that the physical median or barrier separating traffic is about to end. You will be on an undivided two-way road where oncoming traffic is in the opposite lane separated only by pavement markings. This and the Divided Highway Begins sign account for 40% of sign errors on the DMV test.",src:"Handbook S7"},
  {t:"Road Signs",q:"A black and white pennant-shaped sign (a horizontal triangle) on the LEFT side of the road means:",o:["You are entering a no-passing zone - do not pass from this point","Merge left ahead","Road narrows on the left side","Left lane ends"],a:0,e:"The No Passing Zone pennant sign is placed on the left side of the road at the beginning of a zone where passing is prohibited. It is the only pennant-shaped (horizontal triangle pointing right) sign used on US roads. Do not pass any vehicle from this point until the zone ends.",src:"Handbook S7"},
  {t:"Road Signs",q:"What does a 'Do Not Enter' sign look like and when would you see it?",o:["Yellow diamond with an X - at railroad crossings","Red circle with a white horizontal bar - at entrances to one-way roads going against traffic","White rectangle with a red border - at school zones","Red octagon - at all stop-controlled intersections"],a:1,e:"The Do Not Enter sign is a red circle with a white horizontal bar. You see it at the wrong end of one-way streets, freeway off-ramps, and other one-way roads. It means traffic is flowing toward you - entering would put you in the path of oncoming vehicles.",src:"Handbook S7"},
  {t:"Road Signs",q:"What is the difference between a 'Wrong Way' sign and a 'Do Not Enter' sign?",o:["They are identical in meaning and appearance","Do Not Enter is posted before a restricted area; Wrong Way is posted after you have already entered the road going the wrong direction","Wrong Way is only for freeways; Do Not Enter is only for surface streets","Do Not Enter is regulatory; Wrong Way is advisory only"],a:1,e:"Do Not Enter (red circle, white bar) is posted at the entrance to a one-way road to prevent you from entering. Wrong Way (red rectangle, white text) is posted along the road itself for drivers who have already entered going the wrong direction. If you see a Wrong Way sign you are driving into oncoming traffic - pull over safely and correct your direction.",src:"Handbook S7"},
  {t:"Road Signs",q:"What does a yellow diamond sign with an S-curve arrow (winding line) mean?",o:["Road may be slippery when wet - reduce speed","Winding road ahead with several curves or turns - reduce speed","Divided highway begins","Single lane ahead - merge now"],a:1,e:"The Winding Road sign warns of several curves or turns ahead. Reduce your speed before entering the curves. This sign is commonly confused with the Slippery When Wet sign - the key difference is that the Slippery sign shows a skidding car, while the Winding Road sign shows an S-shaped arrow.",src:"Handbook S7"},
  {t:"Road Signs",q:"An orange diamond sign showing a stick figure holding a paddle or sign means:",o:["Road work ahead - all workers have left for the day","Flagger ahead - a person is controlling traffic; you must obey their instructions","Survey crew present - slow to 15 mph","Exit only lane ahead"],a:1,e:"The Flagger Ahead sign warns that a flagger is stationed ahead to control traffic flow through a work zone. Flaggers have the same legal authority as traffic signs and signals. You must follow their instructions, which may include stopping, slowing, or taking an alternate route.",src:"Handbook S7"},
  {t:"Road Signs",q:"A yellow diamond sign showing a right lane with an arrow pointing into the left lane means:",o:["Right turn only - left lane is closed","Right lane ends ahead - drivers in the right lane must merge left","Left lane ends - merge right","Passing lane begins on the right"],a:1,e:"The Lane Ends / Merge sign warns that a lane is ending ahead and drivers must merge into the adjacent lane. If the arrow shows the right lane merging left, drivers in the right lane must move over when it is safe to do so before the lane disappears.",src:"Handbook S7"},
  
  
  {t:"Road Signs",q:"A red and white sign reading 'No Parking - Tow Away Zone' means:",o:["You may park briefly if you stay with the vehicle","You may park here but your vehicle may be towed after 30 minutes","No parking is permitted - your vehicle will be towed at your expense","No parking during rush hours only"],a:2,e:"A No Parking / Tow Away Zone sign means parking is completely prohibited and any vehicle parked there will be towed at the owner's expense. Unlike a red curb which applies at all times, a tow away zone sign may specify hours. Always read the full sign.",src:"Handbook S6"},
  
  
  
  {t:"Road Signs",q:"A white sign with a black arrow pointing right and the words 'Keep Right' means:",o:["Turn right at the next intersection","You must pass to the right of a divider, island, or obstruction ahead","The right lane is faster - move over","Stay in the right lane - left lane is for passing only"],a:1,e:"The Keep Right sign (white rectangle with black arrow) is posted at traffic islands, medians, or obstructions where you must pass to the right side. Do not pass to the left of this sign. It is also used to direct traffic around construction barriers.",src:"Handbook S7"}

var BUILD_VERSION="v26";              // fallback only - used if commit fetch fails (e.g. offline)
var BUILD_DATE="June 30, 2026";       // fallback only
var LIVE_COMMIT_INFO=null;            // populated from GitHub API once fetched
var REPO_OWNER="ramachandrab";
var REPO_NAME="dmv_exam_prep";
var REPO_FILE="index.html";

function buildBadgeText(){
  if(LIVE_COMMIT_INFO) return "Commit "+LIVE_COMMIT_INFO.sha+" &nbsp;&#183;&nbsp; Updated "+LIVE_COMMIT_INFO.date;
  return BUILD_VERSION+" &nbsp;&#183;&nbsp; Updated "+BUILD_DATE+" <span style='opacity:.6'>(offline)</span>";
}
function updateBuildBadges(){
  var f=$("buildBadgeFooter");if(f)f.innerHTML=buildBadgeText();
}
function fetchLatestCommitInfo(){
  try{
    var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    var timer=setTimeout(function(){if(ctrl)ctrl.abort();},6000);
    var opts=ctrl?{signal:ctrl.signal}:{};
    fetch("https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME+"/commits?path="+REPO_FILE+"&per_page=1",opts)
      .then(function(r){clearTimeout(timer);if(!r.ok)throw new Error("bad response");return r.json();})
      .then(function(data){
        if(data&&data[0]&&data[0].sha&&data[0].commit&&data[0].commit.author&&data[0].commit.author.date){
          var d=new Date(data[0].commit.author.date);
          var dateStr=d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
          LIVE_COMMIT_INFO={sha:data[0].sha.slice(0,7),date:dateStr};
          updateBuildBadges();
        }
      })
      .catch(function(){/* keep fallback - offline or rate-limited */});
  }catch(e){/* fetch unsupported - keep fallback */}
}

var SK="ca_dmv_progress";
function saveProgress(){
  try{
    localStorage.setItem(SK,JSON.stringify({
      idx:qs.map(function(q){return Q.indexOf(q);}),
      cur:cur,score:score,
      mis:mistakes.map(function(m){return{qi:Q.indexOf(m),si:m.si};}),
      lbl:label,ts:Date.now()
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    var d=JSON.parse(localStorage.getItem(SK));
    if(!d||typeof d.cur!=="number")return null;
    var rq=[];
    for(var i=0;i<d.idx.length;i++){var q=Q[d.idx[i]];if(q)rq.push(q);}
    if(!rq.length)return null;
    var rm=[];
    if(d.mis){for(var j=0;j<d.mis.length;j++){var mq=Q[d.mis[j].qi];if(mq)rm.push(Object.assign({},mq,{si:d.mis[j].si}));}}
    return{qs:rq,cur:d.cur,score:d.score,mistakes:rm,label:d.lbl||"All "+Q.length+" Questions"};
  }catch(e){return null;}
}
function clearProgress(){try{localStorage.removeItem(SK);}catch(e){}}
function hasProgress(){
  try{var d=JSON.parse(localStorage.getItem(SK));return d&&d.cur>0&&d.cur<Q.length;}catch(e){return false;}
}

// ── QUESTION SEARCH ────────────────────────────────────────────────────────────
var qSearchQuery="";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hlText(text,query){
  if(!query)return esc(text);
  var escaped=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return esc(text).replace(new RegExp("("+escaped+")","gi"),'<span class="search-hl">$1</span>');
}
function onQSearch(val){
  qSearchQuery=val.trim();
  var clrBtn=$("qSearchClr");
  if(clrBtn)clrBtn.style.display=val?"block":"none";
  renderQSearch();
}
function clearQSearch(){
  qSearchQuery="";
  var inp=$("qSearchInp");if(inp)inp.value="";
  var clrBtn=$("qSearchClr");if(clrBtn)clrBtn.style.display="none";
  renderQSearch();
}
function renderQSearch(){
  var norm=$("qNormalContent"),res=$("qSearchResults"),meta=$("qSearchMeta");
  if(!norm||!res||!meta)return;
  var q=qSearchQuery;
  if(!q){
    norm.style.display="";res.style.display="none";meta.style.display="none";
    return;
  }
  norm.style.display="none";res.style.display="";meta.style.display="";
  var lower=q.toLowerCase();
  var matched=Q.filter(function(item){
    return item.q.toLowerCase().indexOf(lower)>-1||
           item.t.toLowerCase().indexOf(lower)>-1||
           item.o.some(function(o){return o.toLowerCase().indexOf(lower)>-1;})||
           (item.e&&item.e.toLowerCase().indexOf(lower)>-1);
  });
  meta.innerHTML=matched.length===0
    ?"No questions match <strong>\""+esc(q)+"\"</strong>"
    :"<strong>"+matched.length+"</strong> of "+Q.length+" questions match <strong>\""+esc(q)+"\"</strong>";
  if(matched.length===0){
    res.innerHTML='<div class="no-results">&#128269; No questions found for <strong>"'+esc(q)+'"</strong><br><a href="#" onclick="clearQSearch();return false;">Clear search</a></div>';
    return;
  }
  var html="";
  for(var i=0;i<matched.length;i++){
    var item=matched[i],c=col(item.t);
    var optsH="";
    for(var oi=0;oi<item.o.length;oi++){
      optsH+='<div style="border-radius:7px;padding:7px 11px;margin-bottom:5px;font-size:clamp(11px,2.4vw,13px);line-height:1.4;border:1px solid #e2e8f0;background:#f8fafc;color:#475569">'+
        '<strong style="color:'+c+'">'+["A","B","C","D"][oi]+'.</strong> '+hlText(item.o[oi],q)+
        (oi===item.a?' <span style="color:#16a34a;font-size:11px;font-weight:700">&#9989; Correct</span>':'')+
      '</div>';
    }
    html+='<div class="qcard" style="margin-bottom:12px">'+
      '<span class="tbadge" style="background:'+c+'22;color:'+c+'">'+hlText(item.t,q)+'</span>'+
      '<div class="qtxt" style="margin-bottom:10px">'+hlText(item.q,q)+'</div>'+
      optsH+
      '<div style="margin-top:8px;border-radius:9px;padding:11px 13px;font-size:clamp(11px,2.4vw,13px);line-height:1.6;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af">'+
        '&#128161; '+hlText(item.e,q)+
        (item.src?'<span class="src-note">Source: '+esc(item.src)+'</span>':'')+
      '</div>'+
    '</div>';
  }
  res.innerHTML=html;
}

// ── STATE ──────────────────────────────────────────────────────────────────────
var screen="menu",activeTab="quiz",qs=[],label="",cur=0,sel=null,score=0,
    mistakes=[],showM=false,expIdx=null,isPartial=false,showCancelModal=false,
    isPausable=false,savedState=null;

// ── CORE FUNCTIONS ─────────────────────────────────────────────────────────────
function startQuiz(arr,lbl,pausable){
  isPausable=(pausable===true);
  if(isPausable){
    var st=loadProgress();
    if(st&&st.cur>0&&st.cur<st.qs.length){
      var rem=st.qs.length-st.cur;
      if(confirm("Saved session found: Q"+st.cur+" done, "+rem+" remaining, score "+st.score+".\n\nOK = Resume  |  Cancel = Start Fresh")){
        qs=st.qs;label=st.label;cur=st.cur;score=st.score;mistakes=st.mistakes.slice();
        sel=null;isPartial=false;showCancelModal=false;savedState=null;
        screen="quiz";renderQuiz();return;
      }else{savedState=null;clearProgress();}
    }else{clearProgress();}
  }
  qs=shuffle(arr);label=lbl;cur=0;sel=null;score=0;mistakes=[];
  showM=false;expIdx=null;isPartial=false;showCancelModal=false;
  screen="quiz";renderQuiz();
}
function pick(i){
  if(sel!==null||showCancelModal)return;
  sel=i;
  if(i===qs[cur].a)score++;
  else mistakes.push(Object.assign({},qs[cur],{si:i}));
  if(isPausable)saveProgress();
  renderQuiz();
}
function next(){
  if(cur+1>=qs.length){
    isPartial=false;
    if(isPausable)clearProgress();
    screen="results";renderResults();
  }else{
    cur++;sel=null;
    if(isPausable)saveProgress();
    renderQuiz();
  }
}
function cancelTest(){showCancelModal=true;renderQuiz();}
function keepGoing(){showCancelModal=false;renderQuiz();}
function endEarly(){
  showCancelModal=false;isPartial=true;
  savedState=null;clearProgress();
  screen="results";renderResults();
}

    '</div>'+
    '<div id="qSearchMeta" class="search-meta" style="display:none"></div>'+
    '<div id="qSearchResults" style="display:none"></div>'+
    '<div id="qNormalContent">'+
    '<p class="sec">Practice Sets</p><div class="btn-set">'+setsHTML+'</div>'+
    '<p class="sec">Practice by Topic</p><div class="grid">'+topicHTML+'</div>'+
    '</div>'+
    '<div class="sources"><h3>&#128218; Official Sources and References</h3>'+srcHTML+
    '<div class="disclaimer">All questions are based on the official California DMV Handbook and California Vehicle Code. This is a practice aid only - always study the official handbook before your exam.<br><span id="buildBadgeFooter" style="opacity:.7">'+buildBadgeText()+'</span> &nbsp;&#183;&nbsp; <span style="opacity:.7">'+Q.length+' questions</span></div></div>';

  var PAGE_CHEAT=
    '<p style="color:#64748b;font-size:12px;line-height:1.5;margin-bottom:14px">Key facts, numbers, and tricks to review right before your exam. Tap any section to expand.</p>'+csHTML;

  var PAGE_GUIDE=
    '<p style="color:#64748b;font-size:12px;line-height:1.5;margin-bottom:10px">Real-world driving skills beyond the exam. Tap any section to expand.</p>'+
    '<div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:12px;color:#1e40af;line-height:1.5"><strong>About this section:</strong> Practical driving skills, California-specific rules, vehicle controls, weather driving, and good habits.</div>'+
    dgHTML;

  // Render DOM
  $("app").innerHTML=
    '<div class="hdr"><div class="hdr-emoji">&#128663;</div>'+
    '<h1>California DMV Practice Quiz</h1>'+
    '<p>'+Q.length+' questions &nbsp;&#183;&nbsp; '+TOPICS.length+' topics &nbsp;&#183;&nbsp; 2026 Edition<br>Verified against the official CA DMV Handbook and California Vehicle Code</p></div>'+
    '<div class="nav-tabs">'+
      '<button class="nav-tab'+(activeTab==="quiz"?" active":"")+'" id="tabQuiz">&#128221; Practice Quiz</button>'+
      '<button class="nav-tab'+(activeTab==="cheat"?" active":"")+'" id="tabCheat">&#128203; Cheat Sheet</button>'+
      '<button class="nav-tab'+(activeTab==="guide"?" active":"")+'" id="tabGuide">&#128737; Driving Guide</button>'+
    '</div>'+
    '<div>'+(activeTab==="quiz"?PAGE_QUIZ:activeTab==="cheat"?PAGE_CHEAT:PAGE_GUIDE)+'</div>';

  // Restore search state if quiz tab is active
  if(activeTab==="quiz"&&qSearchQuery){
    var inp=$("qSearchInp");
    if(inp){inp.value=qSearchQuery;$("qSearchClr").style.display="block";}
    renderQSearch();
  }

    // Event wiring
  on($("tabQuiz"),   "click",function(){activeTab="quiz";  renderHome();});
  on($("tabCheat"),  "click",function(){activeTab="cheat"; renderHome();});
  on($("tabGuide"),  "click",function(){activeTab="guide"; renderHome();});
  on($("resumeBtn"), "click",function(){
    var src=savedState||loadProgress();
    if(!src)return;
    isPausable=true;
    qs=src.qs.slice();label=src.label||"All "+Q.length+" Questions";
    cur=src.cur;score=src.score;mistakes=src.mistakes.slice();
    sel=null;isPartial=false;showCancelModal=false;savedState=null;
    screen="quiz";renderQuiz();
  });
  on($("clearBtn"),"click",function(){savedState=null;clearProgress();renderHome();});

  for(i=0;i<sets.length;i++){
    (function(s,idx){
      on($("app").querySelector('[data-si="'+idx+'"]'),"click",function(){
        var arr;
        if(!s.filter) arr=Q.slice();
        else if(s.filter==="r10") arr=shuffle(Q).slice(0,10);
        else arr=Q.filter(function(q){return s.filter.indexOf(q.t)>-1;});
        startQuiz(arr,s.label,s.pausable===true);
      });
    })(sets[i],i);
  }
  for(i=0;i<TOPICS.length;i++){
    (function(topic,idx){
      on($("app").querySelector('[data-ti="'+idx+'"]'),"click",function(){
        startQuiz(Q.filter(function(q){return q.t===topic;}),"Topic: "+topic,false);
      });
    })(TOPICS[i],i);
  }
  for(si=0;si<CS.length;si++){
    (function(idx){
      on($("app").querySelector('[data-cs="'+idx+'"]'),"click",function(){
        body=$("csb"+idx);chev=$("csc"+idx);
        open=body.classList.contains("open");
        body.classList.toggle("open",!open);chev.classList.toggle("open",!open);
      });
    })(si);
  }
  for(si=0;si<DG.length;si++){
    (function(idx){
      on($("app").querySelector('[data-dg="'+idx+'"]'),"click",function(){
        body=$("dgb"+idx);chev=$("dgc"+idx);
        open=body.classList.contains("open");
        body.classList.toggle("open",!open);chev.classList.toggle("open",!open);
      });
    })(si);
  }
}

// ── RENDER QUIZ ────────────────────────────────────────────────────────────────
function renderQuiz(){
  var q=qs[cur];
  var c=col(q.t);
  var pct=Math.round(cur/qs.length*100);

  var optsHTML="";
  for(var oi=0;oi<q.o.length;oi++){
    var cls="opt";
    if(sel!==null){cls+=" done";if(oi===q.a)cls+=" correct";else if(oi===sel)cls+=" wrong";}
    optsHTML+='<button class="'+cls+'" data-i="'+oi+'"><span class="letter">'+["A","B","C","D"][oi]+'.</span>'+q.o[oi]+'</button>';
  }

  var fbHTML="";
  if(sel!==null){
    fbHTML='<div class="fb"><strong>'+(sel===q.a?"&#9989; Correct!":"&#10060; Incorrect.")+'</strong>'+
      q.e+(q.src?'<span class="src-note">Source: '+q.src+'</span>':'')+
      '<br><button class="nxt" id="nxtBtn">'+(cur+1>=qs.length?"See Results":"Next &#8594;")+'</button></div>';
  }

  var pauseBtnHTML=isPausable?'<button class="bpause" id="pauseBtn">&#9208; Pause</button>':"";

  var modalHTML="";
  if(showCancelModal){
    var ans=cur+(sel!==null?1:0);
    var pauseRow=isPausable?'<button class="mbtn-pause" id="btnPause">&#9208; Save and Pause - come back later</button>':"";
    modalHTML='<div class="modal-bg"><div class="modal"><h3>Leave this test?</h3>'+
      '<p>You have answered <strong>'+ans+' of '+qs.length+'</strong> questions.</p>'+
      '<div class="modal-btns">'+
        '<button class="mbtn-keep" id="btnKeep">&#9654; Keep Going</button>'+
        pauseRow+
        '<button class="mbtn-end" id="btnEnd">&#10005; End and See Results</button>'+
      '</div></div></div>';
  }

  $("app").innerHTML=
    '<div class="topbar"><span class="mlbl">'+label+'</span>'+
    '<div class="quiz-right">'+
      '<span class="scorelbl">Q'+(cur+1)+'/'+qs.length+' &#10003;'+score+' &#10007;'+mistakes.length+'</span>'+
      pauseBtnHTML+
      '<button class="bcanel" id="cancelBtn">&#10005; End</button>'+
    '</div></div>'+
    '<div class="prog"><div class="progb" style="width:'+pct+'%"></div></div>'+
    '<div class="qcard"><span class="tbadge" style="background:'+c+'22;color:'+c+'">'+q.t+'</span>'+
    '<div class="qtxt">'+q.q+'</div></div>'+
    '<div class="opts">'+optsHTML+'</div>'+fbHTML+modalHTML;

  var optBtns=$("app").querySelectorAll(".opt");
  for(var bi=0;bi<optBtns.length;bi++){
    (function(btn){on(btn,"click",function(){pick(+btn.dataset.i);});})(optBtns[bi]);
  }
  on($("nxtBtn"),    "click",next);
  on($("cancelBtn"), "click",cancelTest);
  on($("btnKeep"),   "click",keepGoing);
  on($("btnEnd"),    "click",endEarly);

  function doSaveAndPause(){
    savedState={qs:qs.slice(),label:label,cur:cur,score:score,mistakes:mistakes.slice()};
    saveProgress();
    showCancelModal=false;isPausable=false;
    screen="menu";renderHome();
  }
  var pbtn=$("pauseBtn"),pbtn2=$("btnPause");
  if(pbtn)  on(pbtn,  "click",doSaveAndPause);
  if(pbtn2) on(pbtn2, "click",doSaveAndPause);
}

// ── RENDER RESULTS ─────────────────────────────────────────────────────────────
function renderResults(){
  var answered=isPartial?(cur+(sel!==null?1:0)):qs.length;
  var pct=answered>0?Math.round(score/answered*100):0;
  var passed=(pct>=83)&&!isPartial;
  var rc=isPartial?"#f59e0b":(passed?"#22c55e":"#ef4444");
  var rb=isPartial?"#fffbeb":(passed?"#f0fdf4":"#fef2f2");
  var emoji=isPartial?"&#9208;":(passed?"&#127881;":"&#128218;");
  var title=isPartial?"Test Ended Early":(passed?"Great job!":"Keep practicing!");
  var tc=isPartial?"#b45309":(passed?"#16a34a":"#dc2626");

  var partialBanner=isPartial?
    '<div class="partial-banner">You ended after <strong>'+answered+' of '+qs.length+'</strong> questions. Score is based on answered questions only.</div>':"";

  var mSection="";
  if(mistakes.length===0&&answered>0){
    mSection='<div class="perf">&#11088; No mistakes'+(isPartial?" so far!":"- perfect score!")+'</div>';
  }else if(mistakes.length>0){
    var tbg=showM?"#fef2f2":"#fff7ed",tbc=showM?"#fca5a5":"#fdba74";
    var itemsHTML="";
    if(showM){
      for(var mi=0;mi<mistakes.length;mi++){
        var m=mistakes[mi],open=(expIdx===mi);
        var bodyHTML="";
        if(open){
          var optsH="";
          for(var oi2=0;oi2<m.o.length;oi2++){
            var ocls="mopt"+(oi2===m.a?" mc":oi2===m.si?" mw":"");
            var tag=oi2===m.a?" &#9989; Correct":oi2===m.si?" &#10060; Your answer":"";
            optsH+='<div class="'+ocls+'"><strong>'+["A","B","C","D"][oi2]+'.</strong> '+m.o[oi2]+tag+'</div>';
          }
          bodyHTML='<div class="mbody">'+optsH+'<div class="expl">&#128161; '+m.e+(m.src?'<span class="src-note">Source: '+m.src+'</span>':'')+'</div></div>';
        }
        itemsHTML+='<div class="mitem"><button class="mhdr" data-mi="'+mi+'"><div class="mhdr-info"><div class="mbadge">'+m.t+'</div><div class="mqtxt">'+m.q+'</div></div><span class="mchev'+(open?" open":"")+'">&#9660;</span></button>'+bodyHTML+'</div>';
      }
    }
    mSection='<button class="mtoggle" id="mtoggle" style="background:'+tbg+';border-color:'+tbc+'">'+
      '<span style="font-weight:700;color:#b45309">&#9888; '+mistakes.length+' mistake'+(mistakes.length>1?"s":"")+" to review</span>"+
      '<span style="color:#b45309;font-size:12px;font-weight:600">'+(showM?"Hide &#9650;":"Review &#9660;")+'</span></button>'+
      '<div>'+itemsHTML+'</div>';
  }

  var retryBtn=isPartial?"":'<button class="bret" id="retryBtn">Retry Same Set</button>';
  var backLabel=isPartial?"&#8592; Pick New Topic":"&#8592; Back to Menu";

  $("app").innerHTML=
    '<div class="rcard" style="background:'+rb+';border-color:'+rc+'">'+
    '<div class="rcard-emoji">'+emoji+'</div>'+
    '<div class="rcard-title" style="color:'+tc+'">'+title+'</div>'+
    '<div class="rcard-score">'+score+'/'+answered+' ('+pct+'%)</div>'+
    '<div class="rcard-sub">'+label+(isPartial?"":" &#183; Real exam requires 83%")+'</div></div>'+
    partialBanner+mSection+
    '<div class="arow">'+retryBtn+'<button class="bbk" id="menuBtn">'+backLabel+'</button></div>';

  if(!isPartial)on($("retryBtn"),"click",function(){startQuiz(qs.slice(),label,isPausable);});
  on($("menuBtn"),"click",function(){screen="menu";renderHome();});
  on($("mtoggle"),"click",function(){showM=!showM;expIdx=null;renderResults();});
  var mhdrs=$("app").querySelectorAll(".mhdr");
  for(var mhi=0;mhi<mhdrs.length;mhi++){
    (function(btn){
      on(btn,"click",function(){
        var idx=+btn.dataset.mi;
        expIdx=(expIdx===idx)?null:idx;
        renderResults();
      });
    })(mhdrs[mhi]);
  }
}

// ── BOOT ───────────────────────────────────────────────────────────────────────
renderHome();
fetchLatestCommitInfo();
</script>
</body>
</html>
