<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f1f5f9;min-height:100vh;color:#1e293b;line-height:1.5}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;border:none;background:none}
a{color:#2563eb;text-decoration:none}

#app{max-width:700px;margin:0 auto;padding:16px 14px 60px}
.hdr{text-align:center;margin-bottom:18px}
.hdr-emoji{font-size:48px;line-height:1;margin-bottom:5px}

.nav-tabs{display:flex;gap:6px;margin-bottom:20px}
.nav-tab{flex:1;padding:10px 4px;border-radius:11px;font-size:clamp(11px,2.5vw,13px);font-weight:700;border:2px solid #e2e8f0;background:#fff;color:#64748b;text-align:center;transition:all .15s;line-height:1.3}
.nav-tab.active{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.nav-tab:active{transform:scale(.97)}
.sec{font-weight:700;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;margin:0 0 8px;padding-left:2px}
.btn-set{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.bfull{display:block;width:100%;background:#fff;border-radius:12px;padding:13px 15px;text-align:left;border:2px solid #e2e8f0;transition:transform .1s}
.bfull:active{transform:scale(.98)}
.bfull .lbl{font-weight:700;font-size:clamp(13px,3vw,15px);line-height:1.3;margin-bottom:2px}
.bfull .sub{font-size:clamp(11px,2.4vw,12px);color:#64748b;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:26px}
.btopic{display:block;width:100%;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;border:1.5px solid #e2e8f0;border-left-width:4px;min-height:55px;transition:transform .1s}
.btopic:active{transform:scale(.97)}
.btopic .t{font-weight:700;font-size:clamp(10px,2.1vw,12px);line-height:1.3;margin-bottom:2px}
.btopic .c{font-size:10px;color:#94a3b8}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:6px}
.mlbl{font-weight:700;color:#2563eb;font-size:clamp(11px,2.4vw,13px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.quiz-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.scorelbl{font-size:clamp(11px,2.4vw,12px);color:#64748b;white-space:nowrap}
.bcanel{background:#fee2e2;color:#dc2626;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;border:1.5px solid #fca5a5;white-space:nowrap}
.bcanel:active{background:#fecaca}
.bpause{background:#f0fdf4;color:#15803d;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;border:1.5px solid #86efac;white-space:nowrap}
.bpause:active{background:#dcfce7}
.prog{background:#e2e8f0;border-radius:99px;height:6px;margin-bottom:13px}
.progb{background:#2563eb;height:6px;border-radius:99px;transition:width .35s ease}
.qcard{background:#fff;border-radius:13px;padding:14px 16px;margin-bottom:12px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tbadge{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:3px 9px;margin-bottom:9px;line-height:1.4}
.qtxt{font-size:clamp(14px,3.4vw,16px);font-weight:600;color:#0f172a;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;border-radius:11px;padding:12px 15px;text-align:left;font-size:clamp(13px,2.9vw,15px);font-weight:500;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;line-height:1.4;transition:background .12s,border-color .12s}
.opt:not(.done):hover{background:#f8fafc;border-color:#94a3b8}
.opt:not(.done):active{transform:scale(.985)}
.opt.correct{background:#f0fdf4;border:2px solid #22c55e;color:#15803d;font-weight:600}
.opt.wrong{background:#fef2f2;border:2px solid #ef4444;color:#b91c1c;font-weight:600}
.opt.done{cursor:default}
.letter{font-weight:700;margin-right:8px;opacity:.7}
.opt.correct .letter,.opt.wrong .letter{opacity:1}
.fb{margin-top:12px;border-radius:11px;padding:13px 15px;font-size:clamp(12px,2.7vw,14px);line-height:1.6;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.fb strong{display:block;margin-bottom:4px;font-size:clamp(13px,2.9vw,15px)}
.src-note{display:block;font-size:10px;color:#94a3b8;margin-top:5px}
.nxt{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;border-radius:10px;padding:10px 22px;font-size:clamp(13px,2.9vw,15px);font-weight:700;min-width:120px;text-align:center}
.nxt:active{background:#1d4ed8}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:18px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:800;color:#1e293b;margin-bottom:7px}
.modal p{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:18px}
.modal-btns{display:flex;flex-direction:column;gap:8px}
.mbtn-keep{background:#2563eb;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700;width:100%}
.mbtn-keep:active{background:#1d4ed8}
.mbtn-pause{background:#f0fdf4;color:#15803d;border:1.5px solid #86efac;border-radius:10px;padding:12px;font-size:14px;font-weight:700;width:100%}
.mbtn-pause:active{background:#dcfce7}
.mbtn-end{background:#fee2e2;color:#dc2626;border:1.5px solid #fca5a5;border-radius:10px;padding:12px;font-size:14px;font-weight:700;width:100%}
.mbtn-end:active{background:#fecaca}
.rcard{text-align:center;padding:22px 16px;border-radius:15px;margin-bottom:16px;border:2px solid}
.rcard-emoji{font-size:48px;line-height:1}
.rcard-title{font-size:clamp(16px,4vw,20px);font-weight:800;margin:9px 0 2px}
.rcard-score{font-size:clamp(18px,4.5vw,22px);font-weight:700;color:#1e293b;margin:3px 0}
.rcard-sub{color:#64748b;font-size:12px}
.partial-banner{background:#fff3cd;border:1.5px solid #ffc107;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:#856404;line-height:1.5}
.mtoggle{display:flex;width:100%;justify-content:space-between;align-items:center;border-radius:10px;padding:12px 15px;margin-bottom:8px;border:1.5px solid;font-size:clamp(12px,2.7vw,14px)}
.perf{text-align:center;padding:12px;background:#f0fdf4;border-radius:10px;margin-bottom:14px;color:#15803d;font-weight:700;font-size:13px}
.mitem{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:8px}
.mhdr{display:flex;width:100%;justify-content:space-between;align-items:flex-start;padding:11px 14px;text-align:left;gap:7px}
.mhdr-info{flex:1;min-width:0}
.mbadge{display:inline-block;font-size:9px;font-weight:700;background:#fee2e2;color:#dc2626;border-radius:99px;padding:2px 7px;margin-bottom:4px;white-space:nowrap}
.mqtxt{font-size:clamp(12px,2.7vw,13px);font-weight:600;color:#0f172a;line-height:1.4}
.mchev{font-size:12px;color:#94a3b8;flex-shrink:0;padding-top:2px;transition:transform .2s}
.mchev.open{transform:rotate(180deg)}
.mbody{padding:0 14px 13px}
.mopt{border-radius:7px;padding:7px 11px;margin-bottom:5px;font-size:clamp(11px,2.4vw,13px);line-height:1.4;border:1px solid #e2e8f0;background:#f8fafc;color:#475569}
.mopt.mc{background:#f0fdf4;border-color:#22c55e;color:#15803d}
.mopt.mw{background:#fef2f2;border-color:#ef4444;color:#b91c1c}
.expl{border-radius:8px;padding:10px 12px;margin-top:4px;font-size:clamp(11px,2.4vw,13px);line-height:1.6;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.arow{display:flex;gap:9px;margin-top:5px}
.bret{flex:1;background:#2563eb;color:#fff;border-radius:10px;padding:13px 8px;font-size:clamp(13px,2.9vw,14px);font-weight:700;text-align:center}
.bret:active{background:#1d4ed8}
.bbk{flex:1;background:#f1f5f9;color:#374151;border:1.5px solid #cbd5e1;border-radius:10px;padding:13px 8px;font-size:clamp(13px,2.9vw,14px);font-weight:600;text-align:center}
.bbk:active{background:#e2e8f0}
.acc-section{background:#fff;border-radius:13px;margin-bottom:12px;border:1px solid #e2e8f0;overflow:hidden}
.acc-hdr{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#f8fafc;border-bottom:1px solid #e2e8f0;cursor:pointer}
.acc-icon{font-size:18px;flex-shrink:0}
.acc-title{font-weight:700;font-size:clamp(13px,2.9vw,15px);color:#1e3a8a;flex:1;line-height:1.3}
.acc-chev{font-size:12px;color:#94a3b8;transition:transform .2s;flex-shrink:0}
.acc-chev.open{transform:rotate(180deg)}
.acc-body{padding:14px 15px;display:none}
.acc-body.open{display:block}
.cs-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:clamp(12px,2.5vw,13px);line-height:1.5}
.cs-row:last-child{border-bottom:none}
.cs-key{font-weight:700;color:#1e40af;min-width:clamp(100px,28vw,155px);flex-shrink:0;font-size:clamp(11px,2.3vw,13px)}
.cs-val{color:#374151}
.tip-box{background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:8px 11px;margin:10px 0 4px;font-size:clamp(11px,2.3vw,12px);color:#92400e;line-height:1.5}
.tip-box strong{display:block;margin-bottom:2px}
.dg-card{background:#f8fafc;border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid #2563eb}
.dg-card:last-child{margin-bottom:0}
.dg-card-title{font-weight:700;font-size:clamp(13px,2.8vw,14px);color:#1e3a8a;margin-bottom:8px}
.dg-rule{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:clamp(12px,2.5vw,13px);line-height:1.5;color:#374151}
.dg-rule:last-child{margin-bottom:0}
.dg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.sources{margin-top:28px;background:#fff;border-radius:13px;padding:16px 15px;border:1px solid #e2e8f0}
.sources h3{font-size:14px;color:#1e3a8a;font-weight:700;margin-bottom:12px}
.src-item{padding:9px 0;border-bottom:1px solid #f1f5f9}
.src-item:last-of-type{border-bottom:none}
.src-item .st{font-size:13px;font-weight:600;color:#374151;margin-bottom:3px}
.src-item a{font-size:11px;color:#2563eb;word-break:break-all;display:block}
.src-item .sd{font-size:11px;color:#64748b;margin-top:2px;line-height:1.5}
.disclaimer{margin-top:10px;font-size:11px;color:#94a3b8;line-height:1.6;border-top:1px solid #f1f5f9;padding-top:10px}
.search-wrap{position:relative;margin-bottom:16px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8;pointer-events:none}
.search-inp{width:100%;height:42px;padding:0 38px 0 38px;border:2px solid #e2e8f0;border-radius:11px;background:#fff;color:#1e293b;font-size:clamp(13px,3vw,14px);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.search-inp:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
.search-inp::placeholder{color:#94a3b8}
.search-clr{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:17px;line-height:1;padding:2px 5px;display:none;font-family:inherit}
.search-clr:hover{color:#1e293b}
.search-meta{font-size:12px;color:#64748b;margin:-8px 0 14px;padding-left:2px}
.search-meta strong{color:#2563eb}
.search-hl{background:rgba(250,204,21,0.45);border-radius:2px;padding:0 1px}
.no-results{text-align:center;padding:36px 16px;color:#64748b;font-size:14px;line-height:1.7}
</style>
</head>
